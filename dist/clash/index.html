<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PULSE · 脉冲对决</title>
<style>/* Shared PULSE visual language. Same tokens as the original web client. */
:root {
  --bg: #f5f3ec;
  --paper: #fffcf5;
  --ink: #202934;
  --muted: #788080;
  --line: #dddcd2;
  --accent: #da5c38;
  --mint: #2c7665;
  --gold: #d4a83e;
  --dark: #19222c;
  --radius: 14px;
  font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .42; }
a { color: var(--mint); }
img { max-width: 100%; }
.pulse-top {
  height: 72px;
  padding: 0 max(18px, calc((100vw - 1320px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 1px solid var(--line);
  background: rgba(245, 243, 236, .97);
}
.pulse-brand {
  display: flex;
  gap: 11px;
  align-items: center;
  color: inherit;
  text-decoration: none;
  background: transparent;
  border: 0;
  padding: 0;
}
.pulse-mark {
  width: 34px;
  height: 34px;
  background: var(--ink);
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: #eae8db;
  font-weight: 800;
}
.pulse-name { font-size: 22px; font-weight: 900; letter-spacing: .07em; line-height: 1; }
.pulse-sub { font-size: 10px; letter-spacing: .16em; margin-top: 4px; color: var(--muted); }
.pulse-nav { display: flex; align-items: center; gap: 22px; }
.pulse-nav a {
  color: #6d7475;
  text-decoration: none;
  font-size: 13px;
  padding: 24px 0;
  border-bottom: 2px solid transparent;
}
.pulse-nav a[aria-current="page"] { color: var(--ink); border-color: var(--accent); font-weight: 700; }
.pulse-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 8px;
  border: 0;
  background: var(--ink);
  color: #fff;
  font-size: 14px;
  font-weight: 650;
  text-decoration: none;
}
.pulse-btn.primary { background: var(--accent); color: #fff; }
.pulse-btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.pulse-btn.light { background: #eeede5; color: var(--ink); border: 1px solid #dbdbd1; }
button:focus-visible, a:focus-visible { outline: 3px solid #eea03d; outline-offset: 3px; }
@media (max-width: 720px) {
  .pulse-top { height: auto; min-height: 64px; padding: 10px 14px; flex-wrap: wrap; }
  .pulse-sub { display: none; }
  .pulse-nav { gap: 14px; width: 100%; }
  .pulse-nav a { padding: 8px 0; }
}

body { background: var(--bg); color: var(--ink); }
button { border: 0; color: inherit; background: none; }
.table-page { min-height: 100vh; display: flex; flex-direction: column; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.scenario-row { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 16px 0; }
.scenario-row button, .top-actions button {
  min-height: 36px; padding: 6px 10px; border-radius: 8px;
  background: #eeede5; color: var(--ink); border: 1px solid #dbdbd1; font-size: 12px;
}
.felt {
  margin: 12px 16px 0;
  padding: 14px 14px 8px;
  border-radius: 18px;
  border: 1px solid #d5dbcb;
  background:
    radial-gradient(circle at 50% 0, rgba(255,252,245,.55), transparent 42%),
    #e9ece0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 220px;
  gap: 12px;
  align-items: stretch;
}
.lanes { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.half { display: grid; grid-template-columns: 148px minmax(0, 1fr); grid-template-areas: "hero board"; gap: 10px; align-items: center; }
.hero { grid-area: hero; }
.board-wrap { grid-area: board; min-width: 0; }
.hero {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 8px 20px #20293410;
}
.hero.active { outline: 2px solid var(--accent); }
.hero h2 { margin: 0 0 6px; font-size: 14px; letter-spacing: -.03em; }
.base-btn { width: 74px; height: 74px; border-radius: 50%; background: var(--ink); color: white; margin: 0 auto 6px; display: grid; place-items: center; }
.base-btn .hp { font-size: 28px; font-weight: 800; letter-spacing: -.04em; }
.mana { display: flex; gap: 4px; justify-content: center; min-height: 14px; margin: 6px 0; }
.mana i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--gold); background: transparent; }
.mana i.on { background: var(--gold); }
.pile { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--muted); }
.deck-stack, .grave-stack {
  width: 46px; min-height: 62px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--paper); display: grid; place-items: center; font-weight: 800; color: var(--ink);
}
.deck-stack { background: repeating-linear-gradient(45deg, #e7eee4, #e7eee4 6px, #f7f6f0 6px, #f7f6f0 12px); }
.slots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.slot.empty, .minion {
  min-height: 132px; border-radius: 12px; border: 1px dashed #b7c3ae; background: rgba(255,252,245,.45);
  color: #8a9186; font-size: 12px;
}
.minion {
  position: relative; border-style: solid; border-color: #d4d7c9; background: var(--paper); color: var(--ink);
  padding: 16px 6px 8px; box-shadow: 0 8px 16px #20293414; text-align: center;
}
.minion.selected { outline: 3px solid var(--mint); transform: translateY(-4px); }
.minion.guard { box-shadow: 0 0 0 3px var(--gold), 0 8px 16px #20293414; }
.minion.sick { filter: saturate(.85); }
.minion .portrait { height: 72px; display: grid; place-items: center; }
.minion .portrait img { max-height: 72px; width: auto; object-fit: contain; }
.minion .atk, .minion .hp {
  position: absolute; bottom: 6px; width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center; color: white; font-weight: 800; font-size: 14px;
}
.minion .atk { left: 6px; background: var(--ink); }
.minion .hp { right: 6px; background: var(--accent); }
.minion .mname { display: block; font-size: 12px; font-weight: 750; margin-top: 4px; }
.ribbon { position: absolute; top: 6px; left: 6px; right: 6px; font-size: 10px; font-weight: 700; color: #87611b; }
.glyph {
  width: 54px; height: 54px; margin: 0 auto; border-radius: 12px; background: var(--ink); color: #f5f3ec;
  display: grid; place-items: center; font-size: 22px; font-weight: 800;
}
.mid { display: flex; flex-direction: column; gap: 8px; }
.turn-box { background: var(--ink); color: #f5f3ec; border-radius: 14px; padding: 12px; }
.turn-box h3 { margin: 0 0 6px; font-size: 18px; letter-spacing: -.03em; }
#coach, #last-error { margin: 0; font-size: 12px; line-height: 1.45; color: #d5ddd4; }
#last-error[data-code]:not([data-code=""]) { color: #ffd0c6; }
.end-turn { min-height: 52px; border-radius: 12px; background: var(--accent); color: white; font-weight: 800; font-size: 16px; }
.action-row { display: flex; flex-direction: column; gap: 6px; }
.action-row button { min-height: 36px; border-radius: 8px; background: #eeede5; color: var(--ink); font-size: 12px; }
.action-row button.primary { background: var(--mint); color: white; }
.log { margin: 0; padding-left: 16px; max-height: 92px; overflow: auto; font-size: 11px; color: #5d675c; }
.log .bad { color: #a34428; }
.hand-dock { padding: 8px 16px 16px; }
.hand-dock h3 { margin: 0 0 8px; font-size: 13px; }
.hands { display: flex; gap: 10px; align-items: flex-end; overflow-x: auto; min-height: 168px; padding-bottom: 6px; }
.playcard {
  width: 132px; flex: 0 0 132px; min-height: 196px; text-align: left; position: relative;
  border: 1px solid #d4d7c9; border-radius: 12px; background: var(--paper); color: var(--ink);
  box-shadow: 0 10px 18px #20293414; padding: 8px;
}
.playcard.selected { outline: 3px solid var(--mint); transform: translateY(-12px); }
.playcard .cost, .playcard .star {
  position: absolute; top: 8px; width: 26px; height: 26px; border-radius: 8px;
  display: grid; place-items: center; font-weight: 800; color: white; background: var(--ink);
}
.playcard .cost { left: 8px; }
.playcard .star { right: 8px; background: var(--gold); color: #2a2112; font-size: 12px; }
.playcard .art { height: 96px; display: grid; place-items: center; margin-top: 18px; }
.playcard .art img { max-height: 96px; object-fit: contain; }
.playcard .cname { font-weight: 800; font-size: 13px; margin-top: 4px; }
.playcard .statsline { font-size: 11px; color: var(--muted); }
.back {
  width: 72px; height: 104px; border-radius: 10px; border: 1px solid #c6ccbd; flex: 0 0 72px;
  background: repeating-linear-gradient(45deg, #dee3d5, #dee3d5 8px, #f4f3ea 8px, #f4f3ea 16px);
}
.opp-hand { display: flex; gap: 6px; align-items: center; min-height: 48px; }
.banner, .balance, .foot { margin: 8px 16px 0; color: var(--muted); font-size: 12px; }
.banner { padding: 8px 12px; background: #fff3db; border: 1px solid #e6d4aa; border-radius: 8px; color: #80643b; font-weight: 700; }
.builder { max-width: 1180px; margin: 0 auto; padding: 16px; }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; max-height: 520px; overflow: auto; }
.pool button { text-align: left; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); }
.pool button.picked { outline: 2px solid var(--accent); }
.pool img { height: 72px; object-fit: contain; display: block; margin: 0 auto 6px; }
.catalog { margin: 12px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.catalog article { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
@media (max-width: 900px) {
  .felt { grid-template-columns: 1fr; margin: 8px; }
  .half { grid-template-columns: 96px minmax(0, 1fr); }
  .minion { min-height: 96px; min-width: 0; padding: 12px 2px 6px; }
  .minion .portrait { height: 46px; }
  .minion .portrait img { max-height: 46px; }
  .opp-hand { max-width: 100%; overflow-x: auto; }
  .back { width: 28px; height: 40px; flex-basis: 28px; }
  .playcard { width: 104px; flex-basis: 104px; min-height: 156px; }
  .end-turn { position: sticky; bottom: 8px; width: 100%; }
}
@media (max-width: 640px) {
  .slots { gap: 4px; }
  .minion .mname, .ribbon { font-size: 9px; }
  .minion .atk, .minion .hp { width: 22px; height: 22px; font-size: 12px; }
  .base-btn { width: 58px; height: 58px; }
  .base-btn .hp { font-size: 22px; }
}
</style>

  function starOf(card) {
    if (!card || card.star == null) return null;
    if (card.star === 1 || card.star === 2 || card.star === 3) return card.star;
    return null;
  }

  function familyOf(card) {
    if (!card) return null;
    const value = typeof card.family === 'string' ? card.family : card.growth_family;
    if (typeof value !== 'string') return null;
    const family = value.trim();
    return family ? family : null;
  }

  function validateCard(card) {
    if (card.effect != null && !IMPLEMENTED.has(card.effect)) {
      throw new ClashError('还没有这个效果：' + card.effect, 'unsupported_effect');
    }
    if (card.star != null && starOf(card) == null) {
      throw new ClashError('星级只能是卡数据里的 1、2 或 3', 'bad_star');
    }
    if (Object.prototype.hasOwnProperty.call(card, 'family') && card.family != null && familyOf(card) == null) {
      throw new ClashError('家族必须是卡面上的非空字符串', 'bad_family');
    }
  }

  function loadPack(payload, capabilities) {
    if (!payload || payload.ruleset_id !== RULESET) throw new ClashError('规则集不是 pcg.clash.v0', 'unsupported_effect');
    if (!capabilities || capabilities.ruleset_id !== RULESET || !Array.isArray(capabilities.effects)) {
      throw new ClashError('能力契约不属于这一规则集', 'unsupported_effect');
    }
    for (const effect of capabilities.effects) {
      if (!IMPLEMENTED.has(effect)) throw new ClashError('能力契约里有尚未实现的效果 ' + effect, 'unsupported_effect');
    }
    for (const effect of IMPLEMENTED_EFFECTS) {
      if (!capabilities.effects.includes(effect)) throw new ClashError('能力契约少了已实现的效果 ' + effect, 'unsupported_effect');
    }
    const seen = new Set();
    for (const card of payload.cards) {
      if (seen.has(card.template_id)) throw new ClashError('卡牌编号重复', 'bad_card');
      seen.add(card.template_id);
      validateCard(card);
    }
    validateCard(payload.second_player_token);
    const supportCards = payload.cards.filter(card => card.effect === 'support');
    const support = capabilities.bindings && capabilities.bindings.support;
    if (!support || supportCards.some(card => card.kind !== 'main')) {
      throw new ClashError('支援绑定和卡表不一致', 'binding_mismatch');
    }
    const knobCards = payload.cards.filter(card => card.effect === 'knob');
    const knob = capabilities.bindings.knob;
    if (!knob || knob.temp_attack !== 1 || knobCards.some(card => card.kind !== 'main')) {
      throw new ClashError('旋钮绑定和卡表不一致', 'binding_mismatch');
    }
    const cards = loadCards(payload);
    if (supportCards.length && !cards[support.revive]) throw new ClashError('支援目标不在卡表里', 'binding_mismatch');
    return { cards, rules: rulesFromPayload(payload), tokenId: payload.second_player_token.template_id, capabilities };
  }

  function rulesFromPayload(payload) {
    return {
      baseLife: payload.base_life,
      maxSupply: payload.max_supply,
      handLimit: payload.hand_limit,
      boardLimit: payload.board_limit,
      openingHand: payload.opening_hand.slice()
    };
  }

  function attackOf(cards, unit) {
    const bonus = unit.attachments.reduce((sum, id) => sum + cards[id].attack_bonus, 0);
    return cards[unit.card_id].attack + bonus + unit.temp_attack;
  }

  function hasGuard(cards, unit) {
    if (cards[unit.card_id].guard) return true;
    return unit.attachments.some(id => cards[id].grants_guard);
  }

  function bypassGuard(cards, unit) {
    return unit.attachments.some(id => cards[id].bypass_guard);
  }

  class Game {
    static empty(cards, rules, capabilities) {
      const game = Object.create(Game.prototype);
      game.cards = cards;
      game.rules = rules;
      game.capabilities = capabilities;
      game.bases = [rules.baseLife, rules.baseLife];
      game.max_supply = [0, 0];
      game.supply = [0, 0];
      game.fatigue = [0, 0];
      game.decks = [[], []];
      game.hands = [[], []];
      game.boards = [Array(rules.boardLimit).fill(null), Array(rules.boardLimit).fill(null)];
      game.graves = [[], []];
      game.ability_used = [{}, {}];
      game.promoteBan = [[], []];
      game.seat = 0;
      game.turns_started = [1, 0];
      game.phase = 'main';
      game.winner = null;
      game.log = [];
      game._nextId = 1;
      return game;
    }

    constructor(cards, deck0, deck1, rules, tokenId = 'jie_yi_ge_dian', capabilities = null) {
      this.cards = cards;
      this.rules = rules;
      this.capabilities = capabilities;
      this.bases = [rules.baseLife, rules.baseLife];
      this.max_supply = [0, 0];
      this.supply = [0, 0];
      this.fatigue = [0, 0];
      this.decks = [deck0.slice(), deck1.slice()];
      this.hands = [[], []];
      this.boards = [Array(rules.boardLimit).fill(null), Array(rules.boardLimit).fill(null)];
      this.graves = [[], []];
      this.ability_used = [{}, {}];
      this.promoteBan = [[], []];
      this.seat = 0;
      this.turns_started = [0, 0];
      this.phase = 'opening';
      this.winner = null;
      this.log = [];
      this._nextId = 1;
      for (let n = 0; n < rules.openingHand[0]; n++) this._openingDraw(0);
      for (let n = 0; n < rules.openingHand[1]; n++) this._openingDraw(1);
      this.hands[1].push(tokenId);
      this.log.push('起手：先手3张，后手4张，后手获得借一格电');
    }

    _openingDraw(seat) {
      if (!this.decks[seat].length) throw new ClashError('起手时牌库不够');
      this.hands[seat].push(this.decks[seat].shift());
    }

    event(text) { this.log.push(text); }

    units(seat) { return this.boards[seat].filter(unit => unit != null); }

    aliveCount(seat) { return this.units(seat).length; }

    find(iid) {
      for (const seat of [0, 1]) {
        for (let slot = 0; slot < this.boards[seat].length; slot++) {
          const unit = this.boards[seat][slot];
          if (unit && unit.iid === iid) return [seat, slot, unit];
        }
      }
      throw new ClashError('场上没有这张单位');
    }

    requireMain(seat) {
      if (this.winner != null) throw new ClashError('对局已经结束', 'game_over');
      if (this.phase !== 'main' || this.seat !== seat) throw new ClashError('还没轮到这一方的主阶段', 'not_your_turn');
    }

    start_turn() {
      if (this.winner != null) throw new ClashError('对局已经结束', 'game_over');
      if (this.phase !== 'opening' && this.phase !== 'between') {
        throw new ClashError('回合开始只能接在开局或上一回合结束之后', 'bad_phase');
      }
      const seat = this.seat;
      this.phase = 'start';
      this.turns_started[seat] += 1;
      this.ability_used[seat] = {};
      this.promoteBan[seat] = [];
      const firstOpening = seat === 0 && this.turns_started[seat] === 1;
      if (firstOpening) {
        this.event(`座位${seat}回合开始：先手第1回合不抽牌`);
      } else {
        this.event(`座位${seat}回合开始：抽牌`);
        this.draw(seat);
        if (this.winner != null) return;
      }
      for (const unit of this.units(seat)) {
        unit.sick = false;
        unit.attacked = false;
      }
      this.event(`座位${seat}场上原有单位解除新入场限制`);
      this.max_supply[seat] = Math.min(this.rules.maxSupply, this.max_supply[seat] + 1);
      this.supply[seat] = this.max_supply[seat];
      this.phase = 'main';
      this.event(`座位${seat}供电上限${this.max_supply[seat]}，当前供电回满`);
    }

    draw(seat) {
      if (this.decks[seat].length) {
        const cardId = this.decks[seat].shift();
        if (this.hands[seat].length >= this.rules.handLimit) {
          this.graves[seat].push(cardId);
          this.event(`座位${seat}手牌已满，${this.cards[cardId].name}展示后进入墓地`);
        } else {
          this.hands[seat].push(cardId);
          this.event(`座位${seat}抽到${this.cards[cardId].name}`);
        }
        return;
      }
      this.fatigue[seat] += 1;
      this.bases[seat] = Math.max(0, this.bases[seat] - this.fatigue[seat]);
      this.event(`座位${seat}疲劳${this.fatigue[seat]}，基地变为${this.bases[seat]}`);
      this.check_bases();
    }

    pay(seat, amount) {
      if (this.supply[seat] < amount) throw new ClashError('供电不足', 'not_enough_supply');
      this.supply[seat] -= amount;
    }

    takeHand(seat, cardId) {
      const index = this.hands[seat].indexOf(cardId);
      if (index < 0) throw new ClashError('手牌里没有这张牌', 'not_in_hand');
      this.hands[seat].splice(index, 1);
    }

    emptySlot(seat) {
      const slot = this.boards[seat].indexOf(null);
      return slot < 0 ? null : slot;
    }

    placeNew(seat, cardId, slot = null, sick = true) {
      if (slot == null) slot = this.emptySlot(seat);
      if (slot == null) throw new ClashError('场上没有空位', 'board_full');
      if (this.boards[seat][slot] != null) throw new ClashError('位置已有单位', 'board_full');
      const unit = {
        iid: `u${this._nextId}`,
        card_id: cardId,
        seat,
        slot,
        durability: this.cards[cardId].durability,
        sick,
        attacked: false,
        temp_attack: 0,
        attachments: []
      };
      this._nextId += 1;
      this.boards[seat][slot] = unit;
      this.event(`座位${seat}${this.cards[cardId].name}进入位置${slot}，${sick ? '本回合不能攻击' : '本回合可以攻击'}`);
      return unit;
    }

    resolveIid(seat, ref) {
      if (typeof ref === 'string' && /^u\d+$/.test(ref)) {
        this.find(ref);
        return ref;
      }
      const found = this.units(seat).filter(unit => unit.card_id === ref).map(unit => unit.iid);
      if (found.length !== 1) throw new ClashError('无法唯一确定单位', 'bad_target');
      return found[0];
    }

    play(seat, cardId, target = null, mode = null) {
      this.requireMain(seat);
      const card = this.cards[cardId];
      if (!card) throw new ClashError('未知卡牌');
      if (!this.hands[seat].includes(cardId)) throw new ClashError('手牌里没有这张牌', 'not_in_hand');
      if (this.supply[seat] < card.cost) throw new ClashError('供电不足', 'not_enough_supply');
      let host = null;
      if (card.kind === 'main') {
        if (this.aliveCount(seat) >= this.rules.boardLimit) throw new ClashError('场位已满', 'board_full');
        if (card.effect === 'play_damage' && target != null) {
          const found = this.find(this.resolveIid(1 - seat, target));
          if (found[0] === seat) throw new ClashError('入场伤害只能指定敌方单位', 'bad_target');
        }
      } else if (card.kind === 'attachment') {
        if (target == null) throw new ClashError('配件必须指定己方主控', 'bad_target');
        const found = this.find(this.resolveIid(seat, target));
        if (found[0] !== seat) throw new ClashError('配件只能装在己方主控上', 'bad_target');
        host = found[2];
        if (host.attachments.length >= 1) throw new ClashError('这台主控已经有配件', 'already_has_attachment');
        if (card.grants_guard && hasGuard(this.cards, host)) throw new ClashError('这台主控已经有护卫', 'already_has_guard');
      } else if (card.kind === 'spell') {
        this.prepareSpell(seat, card, target, mode);
      } else {
        throw new ClashError('未知卡种');
      }
      this.pay(seat, card.cost);
      this.takeHand(seat, cardId);
      if (card.kind === 'main') {
        this.placeNew(seat, cardId, null, !card.rush);
        if (card.effect === 'play_draw') this.draw(seat);
        else if (card.effect === 'play_damage' && target != null) {
          const foe = this.find(this.resolveIid(1 - seat, target))[2];
          const amount = card.effect_amount || card.amount || 1;
          foe.durability = Math.max(0, foe.durability - amount);
          this.event(`入场打击，${this.cards[foe.card_id].name}耐久变为${foe.durability}`);
        }
      } else if (card.kind === 'attachment') {
        host.attachments.push(cardId);
        this.event(`${card.name}装到${this.cards[host.card_id].name}上`);
      } else {
        this.castSpell(seat, card, target, mode);
        this.graves[seat].push(cardId);
        this.event(`${card.name}进入墓地`);
      }
      this.check_deaths();
      this.check_bases();
    }

    prepareSpell(seat, card, target, mode) {
      const effect = card.effect;
      if (effect === 'supply' || effect === 'heal_base') return;
      if (effect === 'damage') {
        if (target == null) throw new ClashError('干扰必须指定敌方单位', 'bad_target');
        const found = this.find(this.resolveIid(1 - seat, target));
        if (found[0] === seat) throw new ClashError('干扰只能指定敌方单位', 'bad_target');
        return;
      }
      if (effect === 'mend') {
        if (target == null) throw new ClashError('补给必须指定己方单位', 'bad_target');
        const found = this.find(this.resolveIid(seat, target));
        if (found[0] !== seat) throw new ClashError('补给只能指定己方单位', 'bad_target');
        if (mode !== 'heal' && mode !== 'temp') throw new ClashError('补给要选择修复或临时强化', 'bad_target');
        return;
      }
      throw new ClashError('未知战术');
    }

    castSpell(seat, card, target, mode) {
      const effect = card.effect;
      if (effect === 'supply') {
        this.supply[seat] += card.amount;
        this.event(`当前供电变为${this.supply[seat]}`);
      } else if (effect === 'heal_base') {
        const before = this.bases[seat];
        this.bases[seat] = Math.min(this.rules.baseLife, this.bases[seat] + card.amount);
        this.event(`座位${seat}基地从${before}变为${this.bases[seat]}`);
      } else if (effect === 'damage') {
        const host = this.find(this.resolveIid(1 - seat, target))[2];
        host.durability = Math.max(0, host.durability - card.amount);
        this.event(`${this.cards[host.card_id].name}耐久变为${host.durability}`);
      } else if (effect === 'mend') {
        const found = this.find(this.resolveIid(seat, target));
        const host = found[2];
        if (found[0] !== seat) throw new ClashError('补给只能指定己方单位', 'bad_target');
        if (mode === 'heal') {
          const cap = this.cards[host.card_id].durability;
          host.durability = Math.min(cap, host.durability + card.amount);
          this.event(`${this.cards[host.card_id].name}耐久变为${host.durability}`);
        } else if (mode === 'temp') {
          host.temp_attack += 1;
          this.event(`${this.cards[host.card_id].name}本回合攻击变为${attackOf(this.cards, host)}`);
        } else {
          throw new ClashError('补给要选择修复或临时强化', 'bad_target');
        }
      } else {
        throw new ClashError('未知战术');
      }
    }

    support(seat) {
      this.requireMain(seat);
      const reviveId = this.capabilities.bindings.support.revive;
      const sources = this.units(seat).filter(unit => this.cards[unit.card_id].effect === 'support');
      if (sources.length < 1) throw new ClashError('场上要有一台小印才能支援', 'no_stamp_on_board');
      if (this.ability_used[seat].support) throw new ClashError('本回合已经支援过', 'already_used_ability');
      if (!this.graves[seat].includes(reviveId) || this.promoteBan[seat].includes(reviveId)) {
        throw new ClashError('墓地里没有可支援的厚壳工控', 'no_shell_in_grave');
      }
      if (this.aliveCount(seat) >= this.rules.boardLimit) throw new ClashError('场上没有空位', 'board_full');
      const cost = this.cards[sources[0].card_id].amount;
      if (this.supply[seat] < cost) throw new ClashError('供电不足', 'not_enough_supply');
      this.pay(seat, cost);
      this.ability_used[seat].support = 1;
      this.graves[seat].splice(this.graves[seat].indexOf(reviveId), 1);
      this.event('小印支援，厚壳工控离开墓地');
      return this.placeNew(seat, reviveId);
    }

    promoteCost(currentId, nextId) {
      return Math.max(1, this.cards[nextId].cost - this.cards[currentId].cost);
    }

    promote(seat, currentId) {
      this.requireMain(seat);
      const current = this.cards[currentId];
      if (!current || !current.next_template_id) throw new ClashError('这张牌没有下一星', 'no_growth');
      const nextId = current.next_template_id;
      const next = this.cards[nextId];
      if (!next || current.growth_kind !== 'chain' || next.growth_family !== current.growth_family) {
        throw new ClashError('这张牌没有下一星', 'no_growth');
      }
      if (next.star !== current.star + 1) throw new ClashError('星级没有接上', 'no_growth');
      if (!this.hands[seat].includes(nextId)) throw new ClashError('手牌里没有下一星', 'not_in_hand');
      let found = null;
      for (const unit of this.units(seat)) {
        if (unit.card_id === currentId) { found = ['main', unit]; break; }
        if (unit.attachments.includes(currentId)) { found = ['attachment', unit]; break; }
      }
      if (!found) throw new ClashError('场上没有这一星', 'bad_target');
      const kind = found[0];
      const unit = found[1];
      if (kind === 'attachment' && next.grants_guard && this.cards[unit.card_id].guard) {
        throw new ClashError('这台主控已经有护卫', 'already_has_guard');
      }
      const cost = this.promoteCost(currentId, nextId);
      if (this.supply[seat] < cost) throw new ClashError('供电不足', 'not_enough_supply');
      this.pay(seat, cost);
      this.takeHand(seat, nextId);
      if (kind === 'main') {
        const slot = unit.slot;
        for (const attachment of unit.attachments.slice()) {
          this.graves[seat].push(attachment);
          this.event(`${this.cards[attachment].name}随升星进入墓地`);
        }
        this.boards[seat][slot] = null;
        this.graves[seat].push(currentId);
        this.promoteBan[seat].push(currentId);
        this.event(`${current.name}升星退役，进入墓地`);
        this.placeNew(seat, nextId, slot, true);
      } else {
        unit.attachments.splice(unit.attachments.indexOf(currentId), 1);
        this.graves[seat].push(currentId);
        this.promoteBan[seat].push(currentId);
        unit.attachments.push(nextId);
        this.event(`${current.name}升成${next.name}，仍装在原宿主上`);
      }
      this.check_deaths();
      this.check_bases();
    }

    knob(seat, hostId, target) {
      this.requireMain(seat);
      hostId = this.resolveIid(seat, hostId);
      target = this.resolveIid(seat, target);
      const hostFound = this.find(hostId);
      const knobCard = this.cards[hostFound[2].card_id];
      if (hostFound[0] !== seat || knobCard.effect !== 'knob') {
        throw new ClashError('只有己方旋钮台能调这一下', 'bad_target');
      }
      if (this.ability_used[seat].knob) throw new ClashError('本回合旋钮已经用过', 'already_used_ability');
      const allyFound = this.find(target);
      if (allyFound[0] !== seat) throw new ClashError('旋钮只能强化己方单位', 'bad_target');
      const cost = knobCard.amount;
      if (this.supply[seat] < cost) throw new ClashError('供电不足', 'not_enough_supply');
      this.pay(seat, cost);
      this.ability_used[seat].knob = 1;
      allyFound[2].temp_attack += this.capabilities.bindings.knob.temp_attack;
      this.event(`旋钮台让${this.cards[allyFound[2].card_id].name}本回合攻击变为${attackOf(this.cards, allyFound[2])}`);
    }

    attack(seat, attackerId, target) {
      this.requireMain(seat);
      attackerId = this.resolveIid(seat, attackerId);
      const atkFound = this.find(attackerId);
      if (atkFound[0] !== seat) throw new ClashError('不能操作对方的单位', 'bad_target');
      const attacker = atkFound[2];
      if (attacker.sick) throw new ClashError('新入场的单位本回合不能攻击', 'summoning_sickness');
      if (attacker.attacked) throw new ClashError('这台单位本回合已经攻击过', 'already_attacked');
      const guards = this.units(1 - seat).filter(unit => hasGuard(this.cards, unit));
      if (target === 'base') {
        if (guards.length && !bypassGuard(this.cards, attacker)) throw new ClashError('对方有护卫时只能攻击护卫', 'guard_blocks');
        attacker.attacked = true;
        const damage = attackOf(this.cards, attacker);
        this.bases[1 - seat] = Math.max(0, this.bases[1 - seat] - damage);
        this.event(`${this.cards[attacker.card_id].name}攻击基地，对方基地变为${this.bases[1 - seat]}`);
        this.check_bases();
        return;
      }
      const defFound = this.find(this.resolveIid(1 - seat, target));
      if (defFound[0] === seat) throw new ClashError('不能攻击己方单位', 'bad_target');
      const defender = defFound[2];
      if (guards.length && !guards.includes(defender) && !bypassGuard(this.cards, attacker)) {
        throw new ClashError('对方有护卫时只能攻击护卫', 'guard_blocks');
      }
      attacker.attacked = true;
      const atkDamage = attackOf(this.cards, attacker);
      const defDamage = attackOf(this.cards, defender);
      attacker.durability = Math.max(0, attacker.durability - defDamage);
      defender.durability = Math.max(0, defender.durability - atkDamage);
      this.event(`${this.cards[attacker.card_id].name}与${this.cards[defender.card_id].name}同时结算，耐久变为${attacker.durability}和${defender.durability}`);
      this.check_deaths();
    }

    check_deaths() {
      const dead = [];
      for (const seat of [0, 1]) {
        this.boards[seat].forEach((unit, slot) => {
          if (unit && unit.durability <= 0) dead.push([seat, slot, unit]);
        });
      }
      for (const [seat, slot, unit] of dead) {
        for (const attachment of unit.attachments) {
          this.graves[seat].push(attachment);
          this.event(`${this.cards[attachment].name}随宿主进入墓地`);
        }
        this.graves[seat].push(unit.card_id);
        this.boards[seat][slot] = null;
        this.event(`${this.cards[unit.card_id].name}进入座位${seat}墓地`);
      }
    }

    check_bases() {
      const fallen = this.bases.map((life, seat) => life <= 0 ? seat : -1).filter(seat => seat >= 0);
      if (fallen.length === 2) {
        this.winner = 'draw';
        this.phase = 'over';
        this.event('双方基地同时倒下，平局');
      } else if (fallen.length === 1) {
        this.winner = 1 - fallen[0];
        this.phase = 'over';
        this.event(`座位${fallen[0]}基地倒下，座位${this.winner}获胜`);
      }
    }

    end_turn(seat) {
      this.requireMain(seat);
      for (const unit of this.units(seat)) {
        unit.temp_attack = 0;
        unit.attacked = false;
      }
      this.supply[seat] = 0;
      this.event(`座位${seat}回合结束，临时攻击加成清除，没用完的供电清零`);
      this.seat = 1 - seat;
      this.phase = 'between';
    }

    spawn(seat, cardId, slot, durability = null, sick = false) {
      const card = this.cards[cardId];
      const unit = {
        iid: `u${this._nextId}`,
        card_id: cardId,
        seat,
        slot,
        durability: durability == null ? card.durability : durability,
        sick,
        attacked: false,
        temp_attack: 0,
        attachments: []
      };
      this._nextId += 1;
      if (this.boards[seat][slot] != null) throw new ClashError('位置已有单位');
      this.boards[seat][slot] = unit;
      return unit;
    }

    view() {
      const show = unit => {
        if (!unit) return null;
        return {
          iid: unit.iid,
          card_id: unit.card_id,
          durability: unit.durability,
          attack: attackOf(this.cards, unit),
          sick: unit.sick,
          guard: hasGuard(this.cards, unit),
          attachments: unit.attachments.slice()
        };
      };
      return {
        bases: this.bases.slice(),
        supply: this.supply.slice(),
        max_supply: this.max_supply.slice(),
        hands: this.hands.map(hand => hand.slice()),
        decks: this.decks.map(deck => deck.length),
        boards: this.boards.map(row => row.map(show)),
        graves: this.graves.map(grave => grave.slice()),
        winner: this.winner,
        seat: this.seat,
        phase: this.phase
      };
    }
  }

  function finishTurn(game) {
    game.end_turn(game.seat);
    if (game.winner != null) return;
    game.start_turn();
  }

  const api = Object.freeze({
    RULESET, SOURCE_COMMIT, IMPLEMENTED_EFFECTS, ClashError, loadCards, loadPack,
    rulesFromPayload, starOf, familyOf, attackOf, hasGuard, bypassGuard, Game, finishTurn
  });
  root.PCGClash = api;
  if (typeof module === 'object' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>(function (root) {
  'use strict';
  const C = root.PCGClash;
  const content = root.PCGClashContent;
  const pack = C.loadPack(content, root.PCGClashCapabilities);
  const roster = root.PCGClashRoster;
  const $ = document.querySelector.bind(document);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const rules = pack.rules;
  const tokenId = pack.tokenId;
  const cards = Object.create(null);
  Object.keys(pack.cards).forEach(id => { cards[id] = pack.cards[id]; });
  roster.cards.forEach(card => { cards[card.template_id] = card; });
  const presetFirst = ['art_h039a', 'xiao_yin', 'art_h038a', 'hou_ke', 'dian_zhen', 'art_h027a', 'xuan_niu', 'art_h003', 'art_h025', 'lian_jie'];
  const presetSecond = ['art_h005', 'art_h007', 'qiao_jian', 'art_h032', 'art_h036', 'art_h036a', 'art_c004c', 'art_c004d', 'gan_rao', 'hu_zhao'];
  const seatName = seat => seat === 0 ? '先手' : '后手';
  const kindName = kind => kind === 'main' ? '主控' : kind === 'attachment' ? '配件' : '战术';
  function blurb(card) {
    let text = kindName(card.kind);
    if (card.kind === 'main') text = `主控 · 攻${card.attack} 耐${card.durability}${card.guard ? ' · 护卫' : ''}`;
    else if (card.attack_bonus) text = `配件 · 攻击 +${card.attack_bonus}`;
    else if (card.grants_guard) text = '配件 · 获得护卫';
    else if (card.bypass_guard) text = '配件 · 无视护卫';
    else if (card.effect === 'supply') text = `战术 · 供电 +${card.amount}`;
    else if (card.effect === 'heal_base') text = `战术 · 基地 +${card.amount}`;
    else if (card.effect === 'damage') text = `战术 · 敌方 -${card.amount} 耐久`;
    else if (card.effect === 'mend') text = `战术 · 修复 ${card.amount} 或攻击 +1`;
    const star = C.starOf(card);
    if (star != null) text += ` · ${star}星`;
    return text;
  }

  let game = null;
  let ui = blankUi('lesson');

  function blankUi(scenario) {
    return { scenario, reveal: false, catalog: false, handIndex: null, attacker: null, target: null, knob: false, error: null, log: [] };
  }

  function push(text, code) {
    ui.log.push({ text, code: code || '' });
    if (ui.log.length > 40) ui.log.shift();
  }

  function note(error) {
    ui.error = { code: error.code || 'rejected', message: error.message || String(error) };
    push(ui.error.message, ui.error.code);
    render();
  }

  function clearChoice() {
    ui.handIndex = null;
    ui.attacker = null;
    ui.target = null;
    ui.knob = false;
    ui.error = null;
  }

  function begin(scenario) {
    const keepReveal = ui.reveal;
    ui = blankUi(scenario);
    ui.reveal = keepReveal;
    if (scenario === 'lesson') {
      game = new C.Game(cards, content.decks.first.slice(), content.decks.second.slice(), rules, tokenId, pack.capabilities);
      game.start_turn();
      push('教学局。牌序固定，不洗牌。先手第 1 回合不抽牌，供电已回满。');
    } else if (scenario === 'support-present') {
      game = C.Game.empty(cards, rules, pack.capabilities);
      game.supply = [6, 6];
      game.max_supply = [6, 6];
      game.bases = [16, 18];
      game.hands = [['bu_ji', 'gan_rao'], []];
      game.graves = [['hou_ke'], []];
      game.spawn(0, 'xiao_yin', 0, null, false);
      game.spawn(1, 'dian_zhen', 0);
      push('摆阵：小印已经在场，厚壳在自己的墓地。支援叫回厚壳，小印留在场上。');
    } else if (scenario === 'support-deploy') {
      game = C.Game.empty(cards, rules, pack.capabilities);
      game.supply = [6, 6];
      game.max_supply = [6, 6];
      game.hands = [['xiao_yin'], []];
      game.graves = [['hou_ke'], []];
      push('摆阵：厚壳已在墓地，小印还在手牌。没有小印在场时支援不会扣电。');
    } else if (scenario === 'support-again') {
      game = C.Game.empty(cards, rules, pack.capabilities);
      game.supply = [0, 2];
      game.max_supply = [3, 2];
      game.bases = [16, 18];
      game.hands = [[], ['gan_rao']];
      game.turns_started = [0, 1];
      game.spawn(0, 'hou_ke', 0, 2, false);
      game.spawn(0, 'xiao_yin', 1, null, false);
      game.seat = 1;
      push('摆阵：后手用干扰打掉位置 0 的厚壳。小印留在位置 1。结束回合后先手可以再支援。');
    } else if (scenario === 'promote-stamp') {
      game = C.Game.empty(cards, rules, pack.capabilities);
      game.supply = [5, 0];
      game.max_supply = [5, 0];
      game.hands = [['art_h038a'], []];
      const stamp = game.spawn(0, 'xiao_yin', 2, null, false);
      stamp.attachments = ['lian_jie'];
      game.graves = [['hou_ke'], []];
      push('摆阵：位置 2 的小印挂着链节，手牌是小印改。升星费用是差价 1。');
    } else if (scenario === 'builder') {
      game = null;
      ui.decks = [presetFirst.slice(), presetSecond.slice()];
      ui.builderSeat = 0;
      ui.poolFilter = 'chain';
      push('扩展组牌。点选顺序就是牌库从上到下的顺序，不洗牌。');
    }
    render();
  }

  function selectedCard() {
    if (ui.handIndex == null) return null;
    const id = game.hands[game.seat][ui.handIndex];
    return id ? cards[id] : null;
  }

  function coach() {
    if (game.winner != null) return '终局已锁定。出牌、攻击、支援、旋钮和结束回合都会被拒绝。';
    if (ui.knob) return '旋钮已准备。点一台己方单位，本回合攻击 +1。可以点旋钮台自己。新入场也能用。';
    const card = selectedCard();
    if (card && card.kind === 'main') return `准备打出${card.name}。它进入最左边的空位，本回合不能攻击，技能不受这个限制。`;
    if (card && card.effect === 'supply') return '打出后当前供电 +1，可以暂时高于上限。回合结束会清零。';
    if (card && card.effect === 'heal_base') return '打出后己方基地恢复 4，不超过 20。';
    if (card && card.kind === 'attachment') return `点一台己方主控，装上${card.name}。一台只能挂一个。护罩不能装到已有护卫的单位。`;
    if (card && card.effect === 'damage') return '点一台敌方单位。护卫拦不住，也没有反击。';
    if (card && card.effect === 'play_damage') return '可以点一台敌方单位造成 1 点伤害，护卫拦不住。也可以不指定目标，那样不造成伤害。';
    if (card && card.effect === 'play_draw') return '打出后额外抽 1 张。手牌满了会亮出进墓地。';
    if (card && card.rush) return '这张有冲锋，打出后本回合可以攻击。升星进来的仍不能攻击。';
    if (card && card.effect === 'mend' && !ui.target) return '点一台己方单位。可以修复耐久，或让它本回合攻击 +1。不能治疗基地。';
    if (card && card.effect === 'mend') return '选择修复 2 点耐久（不超过卡面），或本回合攻击 +1。';
    if (ui.attacker) return '点敌方单位，或按“攻击对方基地”。新入场不能攻击。对方有护卫时，没有千里眼就只能打护卫。';
    return '点手牌出牌，点己方单位后再选攻击目标。场上的小印可以支援自己墓地里的厚壳，小印不会离场。';
  }

  const artbook = root.PCGClashArt || {};
  function picture(card, kind) {
    const shot = card && artbook[card.rid];
    if (!shot) return `<span class="glyph" aria-hidden="true">${esc((card && card.name || '?').slice(0, 1))}</span>`;
    return `<img src="${esc(kind === 'board' ? shot.char : shot.card)}" alt="" draggable="false">`;
  }
  function mana(seat) {
    const max = game.max_supply[seat];
    const cur = game.supply[seat];
    const count = Math.max(max, Math.min(cur, 10));
    return `<div class="mana">${Array.from({length: count}, (_, i) => `<i class="${i < cur ? 'on' : ''}"></i>`).join('')}</div>`;
  }
  function handHtml(seat, dock) {
    const show = ui.reveal || seat === game.seat;
    if (!show) {
      const backs = game.hands[seat].map(() => '<div class="back" aria-hidden="true"></div>').join('');
      return `<div class="${dock ? 'hands' : 'opp-hand'}" data-hand-seat="${seat}" data-hidden="1">${backs}<span>手牌 ${game.hands[seat].length}</span></div>`;
    }
    const open = game.hands[seat].map((id, index) => {
      const card = cards[id];
      const selected = seat === game.seat && ui.handIndex === index;
      const star = C.starOf(card);
      const body = `${picture(card, 'hand')}<span class="cost">${card.cost}</span>${star ? `<span class="star">${star}</span>` : ''}<span class="cname">${esc(card.name)}</span><span class="statsline">${esc(blurb(card))}</span>`;
      if (seat !== game.seat) return `<div class="playcard" data-card="${esc(id)}">${body}<span class="statsline">教学明牌</span></div>`;
      return `<button type="button" class="playcard${selected ? ' selected' : ''}" data-action="select-hand" data-hand-index="${index}" data-card="${esc(id)}">${body}</button>`;
    }).join('');
    return `<div class="${dock ? 'hands' : 'opp-hand'}" data-hand-seat="${seat}" data-hidden="0">${open || '<span>没有手牌</span>'}</div>`;
  }
  function unitHtml(seat, slot, unit) {
    if (!unit) return `<div class="slot empty" data-board-seat="${seat}" data-slot="${slot}" data-card="">空位</div>`;
    const card = cards[unit.card_id];
    const selected = ui.attacker === unit.iid;
    const ribbons = [
      unit.sick ? '新入场' : '',
      unit.attacked ? '已攻击' : '',
      C.hasGuard(cards, unit) ? '护卫' : '',
      unit.attachments.map(id => cards[id].name).join(' ')
    ].filter(Boolean).join(' · ');
    return `<button type="button" class="minion${selected ? ' selected' : ''}${C.hasGuard(cards, unit) ? ' guard' : ''}${unit.sick ? ' sick' : ''}${unit.attacked ? ' spent' : ''}" data-action="select-unit" data-board-seat="${seat}" data-slot="${slot}" data-seat="${seat}" data-iid="${esc(unit.iid)}" data-card="${esc(unit.card_id)}" data-sick="${unit.sick}" data-guard="${C.hasGuard(cards, unit)}" data-attack="${C.attackOf(cards, unit)}" data-durability="${unit.durability}">
      <span class="portrait">${picture(card, 'board')}</span>
      <span class="atk">${C.attackOf(cards, unit)}</span>
      <span class="hp">${unit.durability}</span>
      <span class="mname">${esc(card.name)}</span>
      ${ribbons ? `<span class="ribbon">${esc(ribbons)}</span>` : ''}
    </button>`;
  }
  function hero(seat) {
    const active = game.seat === seat && game.phase === 'main';
    const top = game.graves[seat].at(-1);
    return `<aside class="hero${active ? ' active' : ''}">
      <h2>${seatName(seat)}</h2>
      <button type="button" class="base-btn" data-action="hit-base" data-seat="${seat}" aria-label="${seatName(seat)}基地"><span class="hp" data-seat="${seat}" data-stat="base">${game.bases[seat]}</span></button>
      ${mana(seat)}

      <div class="pile">
        <div class="deck-stack" data-seat="${seat}" data-stat="deck">${game.decks[seat].length}</div>

      <div class="pile">疲劳 <b data-seat="${seat}" data-stat="fatigue">${game.fatigue[seat]}</b> · 手牌 <b data-seat="${seat}" data-stat="hand">${game.hands[seat].length}</b></div>
      <ol class="grave" data-grave="${seat}" hidden>${game.graves[seat].map(id => `<li data-card="${esc(id)}">${esc(cards[id].name)}</li>`).join('')}</ol>
    </aside>`;
  }

  function catalog() {
    if (!ui.catalog) return '';
    const rows = content.cards.map(card => `<article>
      <h4>${esc(card.name)} · ${card.cost} 费</h4>
      <p>${kindName(card.kind)}${card.kind === 'main' ? ` · 攻 ${card.attack} · 耐 ${card.durability}` : ''}${card.guard ? ' · 护卫' : ''}</p>
      <p>玩法种类：${kindName(card.kind)}。游戏角色：${esc(card.game_role || '卡表未单列')}。硬件主控：${esc(card.hardware_controller || '卡表未单列，不从玩法反推')}。美术 type：${card.art_type == null ? '未填' : esc(card.art_type)}。</p>

  }

  function actions() {
    const card = selectedCard();
    const bits = [];
    if (card && (card.kind === 'main' || card.effect === 'supply' || card.effect === 'heal_base')) {
      const label = card.effect === 'play_damage' ? '不造成伤害，直接打出' : card.kind === 'main' ? '打出到最左空位' : '打出';
      bits.push(`<button type="button" class="primary" data-action="play">${label}</button>`);
    }
    if (card && card.effect === 'mend' && ui.target) {
      bits.push('<button type="button" class="primary" data-action="mend-heal">修复 2 点耐久</button>');
      bits.push('<button type="button" class="primary" data-action="mend-temp">本回合攻击 +1</button>');
    }
    bits.push('<button type="button" data-action="attack-base">攻击对方基地</button>');
    bits.push(promoteButtons());
    bits.push('<button type="button" data-action="support">小印支援厚壳</button>');
    bits.push('<button type="button" data-action="arm-knob">旋钮强化</button>');
    return bits.join('');
  }

  function promoteChoices() {
    if (!game || game.phase !== 'main' || game.winner != null) return [];
    const hand = game.hands[game.seat];
    const found = [];
    for (const unit of game.units(game.seat)) {
      const card = cards[unit.card_id];
      if (card && card.next_template_id && hand.includes(card.next_template_id)) {
        found.push({ currentId: unit.card_id, where: '位置 ' + unit.slot });
      }
      for (const attachment of unit.attachments) {
        const part = cards[attachment];
        if (part && part.next_template_id && hand.includes(part.next_template_id)) {
          found.push({ currentId: attachment, where: cards[unit.card_id].name + ' 的配件' });
        }
      }
    }
    return found;
  }

  function promoteButtons() {
    return promoteChoices().map(choice => {
      const current = cards[choice.currentId];
      const next = cards[current.next_template_id];
      const cost = Math.max(1, next.cost - current.cost);
      const short = game.supply[game.seat] < cost ? '，电不够' : '';
      return `<button type="button" class="primary" data-action="promote" data-current="${esc(choice.currentId)}">升到${esc(next.name)}，需要 ${cost} 电${short}（${esc(choice.where)}）</button>`;
    }).join('');
  }

  function deckOk(deck) {
    return deck.length >= 8 && deck.length <= 12 && new Set(deck).size === deck.length && deck.filter(id => cards[id].kind === 'main').length >= 4;
  }

  function renderBuilder() {
    const seat = ui.builderSeat || 0;
    const deck = ui.decks[seat];
    const filters = [['all', '全部'], ['main', '主控'], ['attachment', '配件'], ['chain', '可升星'], ['baseline', '基线无图']];
    const baselineOnly = new Set(content.cards.map(card => card.template_id).filter(id => !roster.cards.some(card => card.template_id === id)));
    const list = Object.keys(cards).filter(id => id !== tokenId).map(id => cards[id]).filter(card => {
      if (ui.poolFilter === 'main') return card.kind === 'main';
      if (ui.poolFilter === 'attachment') return card.kind === 'attachment';
      if (ui.poolFilter === 'chain') return card.growth_kind === 'chain';
      if (ui.poolFilter === 'baseline') return baselineOnly.has(card.template_id);
      return true;
    }).sort((a, b) => a.name.localeCompare(b.name, 'zh'));
    $('#app').innerHTML = `<header class="top">
      <div class="brand"><b>PULSE</b><span>扩展组牌</span></div>
      <nav class="pulse-nav" data-shared-entry="clash-home"><a href="../../index.html">大厅</a><a href="../../wiki/index.html">图鉴</a><a href="../index.html">旧版点数</a></nav>
      <button type="button" class="btn" data-action="scenario" data-scenario="lesson">返回教学局</button>
    </header>
    <main class="builder" data-scenario="builder" data-ruleset="${esc(content.ruleset_id)}">
      <p class="balance">96 张扩展加 7 张没有对应图的基线牌。每副 8 到 12 张，至少 4 张主控，同名 1 张。星级只认卡上的 star，不认版本号。数值待试玩。</p>
      <div class="scenario-row">
        <button type="button" data-action="builder-seat" data-seat="0">先手 ${ui.decks[0].length} 张</button>
        <button type="button" data-action="builder-seat" data-seat="1">后手 ${ui.decks[1].length} 张</button>
        <button type="button" data-action="preset" data-preset="first">先手示例：小印链</button>
        <button type="button" data-action="preset" data-preset="second">后手示例：壳与表</button>
        <button type="button" class="primary" data-action="start-free" ${deckOk(ui.decks[0]) && deckOk(ui.decks[1]) ? '' : 'disabled'}>开始扩展对局</button>
      </div>
      <p>${seatName(seat)}牌库：</p>
      <div class="deck-picks" data-deck="${seat}">${deck.map(id => `<span data-card="${esc(id)}">${esc(cards[id].name)}</span>`).join('、') || '还没选'}</div>
      <div class="scenario-row">${filters.map(([id, label]) => `<button type="button" data-action="pool-filter" data-value="${id}">${label}</button>`).join('')}</div>
      <div class="pool">${list.map(card => {
        const star = C.starOf(card);
        const picked = deck.includes(card.template_id);
        return `<button type="button" class="${picked ? 'picked' : ''}" data-action="toggle-pool" data-card="${esc(card.template_id)}">${esc(card.name)} · ${card.cost}费 · ${kindName(card.kind)}${star ? ' · ' + star + '星' : ''}${card.growth_kind === 'chain' ? ' · 可升星' : ''}<br><span class="hint">${esc(card.game_description || card.role_note || '基线牌，没有 96 图')}</span></button>`;
      }).join('')}</div>
    </main>`;
    document.body.dataset.ready = '1';
  }

  function render() {
    if (ui.scenario === 'builder') return renderBuilder();
    const over = game.winner == null ? '' : game.winner === 'draw' ? '平局' : `${seatName(game.winner)}获胜`;
    const active = game.seat;
    $('#app').innerHTML = `<div class="table-page">
    <header class="pulse-top">
      <a class="pulse-brand" data-nav="lobby" href="../../index.html"><span class="pulse-mark">P</span><span><span class="pulse-name">PULSE</span><div class="pulse-sub">脉冲对决</div></span></a>
      <nav class="pulse-nav" data-shared-entry="clash-home" aria-label="站点入口">
        <a data-nav="lobby" href="../../index.html">大厅</a>
        <a data-nav="clash" href="./index.html" aria-current="page">回合战</a>
        <a data-nav="wiki" href="../../wiki/index.html">图鉴</a>
        <a data-nav="legacy" href="../index.html">旧版点数</a>
      </nav>
      <div class="top-actions">
        <button type="button" data-action="toggle-reveal" aria-pressed="${ui.reveal}">${ui.reveal ? '遮住对方手牌' : '教学明牌'}</button>
        <button type="button" data-action="restart">重新开局</button>
      </div>
    </header>
    ${ui.reveal ? '<div class="banner" id="reveal-banner">教学明牌 · 双方手牌都看得见 · 牌库仍只显示张数</div>' : '<div id="reveal-banner" hidden></div>'}
    <div class="scenario-row">
      <button type="button" data-action="scenario" data-scenario="lesson">教学局</button>
      <button type="button" data-action="scenario" data-scenario="support-present">战例：小印已在场</button>
      <button type="button" data-action="scenario" data-scenario="support-deploy">战例：先打出小印</button>
      <button type="button" data-action="scenario" data-scenario="support-again">战例：厚壳再死</button>
      <button type="button" data-action="scenario" data-scenario="promote-stamp">战例：小印升星</button>
      <button type="button" data-action="scenario" data-scenario="builder">扩展组牌</button>
    </div>
    <main class="table felt" data-scenario="${esc(ui.scenario)}" data-ruleset="${esc(content.ruleset_id)}" data-source-commit="${esc(C.SOURCE_COMMIT)}">
      <div class="lanes">
        <section class="half foe">${hero(1)}<div class="board-wrap"><div class="slots">${game.boards[1].map((unit, slot) => unitHtml(1, slot, unit)).join('')}</div>${active === 1 ? '' : handHtml(1, false)}</div></section>
        <section class="half mine">${hero(0)}<div class="board-wrap"><div class="slots">${game.boards[0].map((unit, slot) => unitHtml(0, slot, unit)).join('')}</div>${active === 0 ? '' : handHtml(0, false)}</div></section>
      </div>
      <aside class="mid">
        <div class="turn-box">
          <h3 id="turn-label" data-seat="${game.seat}">${over || seatName(game.seat) + '的回合'}</h3>
          <p id="coach">${esc(coach())}</p>
          <p id="last-error" data-code="${esc(ui.error ? ui.error.code : '')}">${ui.error ? esc(ui.error.message) + '（' + esc(ui.error.code) + '）' : ''}</p>
        </div>
        <button type="button" class="end-turn" data-action="end-turn">结束回合</button>
        <div class="action-row">${actions()}</div>
        <ol id="action-log" class="log">${ui.log.slice(-4).reverse().map(item => `<li${item.code ? ` class="bad" data-error-code="${esc(item.code)}"` : ''}>${esc(item.text)}</li>`).join('')}</ol>
      </aside>
    </main>
    <section class="hand-dock" aria-label="当前手牌"><h3>${seatName(active)}的手牌</h3>${handHtml(active, true)}</section>
    <p class="foot">待试玩数值。有图的牌用图鉴里的对应 rid，没有图的基线牌用字标。版本号不算星级。</p>
    </div>`;
    document.body.dataset.ready = '1';
    document.body.dataset.ruleset = content.ruleset_id;
  }

  function play(target, mode) {
    const card = selectedCard();
    if (!card) return note(new C.ClashError('请先选择手牌', 'not_in_hand'));
    const seat = game.seat;
    try {
      game.play(seat, card.template_id, target == null ? null : target, mode || null);
    } catch (error) {
      return note(error);
    }
    let text = `${seatName(seat)}打出${card.name}，费用 ${card.cost}。`;
    if (card.effect === 'supply') text += `当前供电 ${game.supply[seat]}，上限仍是 ${game.max_supply[seat]}。`;
    push(text);
    clearChoice();
    render();
  }

  function attack(target) {
    if (!ui.attacker) return note(new C.ClashError('请先点一台己方单位', 'bad_target'));
    const attacker = game.find(ui.attacker)[2];
    try {
      game.attack(game.seat, ui.attacker, target);
    } catch (error) {
      return note(error);
    }
    const name = cards[attacker.card_id].name;
    push(target === 'base' ? `${name}攻击了对方基地。` : `${name}与对方单位同时结算伤害。`);
    clearChoice();
    render();
  }

  function onUnit(el) {
    const iid = el.dataset.iid;
    const seat = Number(el.dataset.seat);
    const card = selectedCard();
    if (ui.knob) {
      try { game.knob(game.seat, pack.capabilities.bindings.knob.source, iid); }
      catch (error) { return note(error); }
      push(`旋钮台强化了${cards[game.find(iid)[2].card_id].name}，本回合攻击 +1。`);
      clearChoice();
      return render();
    }
    if (card && card.effect === 'play_damage') {
      if (seat === game.seat) return note(new C.ClashError('入场伤害只能指定敌方单位', 'bad_target'));
      return play(iid);
    }
    if (card && (card.kind === 'attachment' || card.effect === 'damage')) return play(iid);
    if (card && card.effect === 'mend') {
      ui.target = iid;
      ui.error = null;
      return render();
    }
    if (seat === game.seat) {
      ui.attacker = iid;
      ui.handIndex = null;
      ui.error = null;
      return render();
    }
    if (ui.attacker) return attack(iid);
    note(new C.ClashError('这台不是你的单位', 'bad_target'));
  }

  function endTurn() {
    const next = 1 - game.seat;
    const deckBefore = game.decks[next].length;
    const handBefore = game.hands[next].length;
    const graveBefore = game.graves[next].length;
    const fatigueBefore = game.fatigue[next];
    const actor = seatName(game.seat);
    try {
      C.finishTurn(game);
    } catch (error) {
      return note(error);
    }
    clearChoice();
    let text = `${actor}结束回合，临时攻击和供电清零。立刻轮到${seatName(game.seat)}。`;
    if (deckBefore === 0 && game.fatigue[next] !== fatigueBefore) {
      text += game.winner != null
        ? ` ${seatName(next)}疲劳后基地倒下，供电上限没有增加。终局锁定。`
        : ` ${seatName(next)}疲劳 ${game.fatigue[next]}，基地 ${game.bases[next]}，然后供电回满。`;
    } else if (deckBefore > 0 && game.hands[next].length === handBefore && game.graves[next].length > graveBefore) {
      text += ` 手牌已满，${cards[game.graves[next].at(-1)].name}亮出后进入墓地。`;
    } else if (deckBefore > 0 && game.hands[next].length > handBefore) {
      text += ui.reveal ? ` 教学明牌：抽到${cards[game.hands[next].at(-1)].name}。` : ' 抽了 1 张牌。';
    } else if (game.seat === 0 && game.turns_started[0] === 1) {
      text += ' 先手第 1 回合不抽牌。';
    }
    push(text);
    render();
  }

  function act(action, el) {
    if (action === 'toggle-reveal') { ui.reveal = !ui.reveal; return render(); }
    if (action === 'toggle-catalog') { ui.catalog = !ui.catalog; return render(); }
    if (action === 'restart' || action === 'scenario') return begin(action === 'restart' ? ui.scenario : el.dataset.scenario);
    if (action === 'select-hand') {
      ui.handIndex = Number(el.dataset.handIndex);
      ui.attacker = null;
      ui.target = null;
      ui.knob = false;
      ui.error = null;
      return render();
    }
    if (action === 'select-unit') return onUnit(el);
    if (action === 'play') return play(null);
    if (action === 'mend-heal') return play(ui.target, 'heal');
    if (action === 'mend-temp') return play(ui.target, 'temp');
    if (action === 'attack-base') return attack('base');
    if (action === 'hit-base') {
      if (Number(el.dataset.seat) !== game.seat && ui.attacker) return attack('base');
      return;
    }
    if (action === 'support') {
      try { game.support(game.seat); }
      catch (error) { return note(error); }
      push('小印支援：厚壳以满耐久进入最左空位，有护卫，本回合不能攻击。小印留在场上。');
      clearChoice();
      return render();
    }
    if (action === 'arm-knob') {
      ui.knob = true;
      ui.handIndex = null;
      ui.attacker = null;
      ui.error = null;
      return render();
    }
    if (action === 'promote') {
      const currentId = el.dataset.current;
      const current = cards[currentId];
      const next = cards[current.next_template_id];
      const cost = Math.max(1, next.cost - current.cost);
      try { game.promote(game.seat, currentId); }
      catch (error) { return note(error); }
      push(`${current.name}升成${next.name}，花了 ${cost} 电。新牌在原处，满耐久，本回合不能攻击，旧配件不留下。`);
      clearChoice();
      return render();
    }
    if (action === 'builder-seat') { ui.builderSeat = Number(el.dataset.seat); return render(); }
    if (action === 'pool-filter') { ui.poolFilter = el.dataset.value; return render(); }
    if (action === 'preset') {
      ui.decks[ui.builderSeat] = (el.dataset.preset === 'second' ? presetSecond : presetFirst).slice();
      return render();
    }
    if (action === 'toggle-pool') {
      const id = el.dataset.card;
      const deck = ui.decks[ui.builderSeat];
      const index = deck.indexOf(id);
      if (index >= 0) deck.splice(index, 1);
      else if (deck.length >= 12) return note(new C.ClashError('一副最多 12 张', 'bad_card'));
      else deck.push(id);
      ui.error = null;
      return render();
    }
    if (action === 'start-free') {
      if (!deckOk(ui.decks[0]) || !deckOk(ui.decks[1])) return note(new C.ClashError('两副都要 8 到 12 张，且至少 4 张主控', 'bad_card'));
      const decks = ui.decks.map(deck => deck.slice());
      ui = blankUi('free');
      game = new C.Game(cards, decks[0], decks[1], rules, tokenId, pack.capabilities);
      game.start_turn();
      push('扩展对局开始。牌序按组牌时的点选顺序，不洗牌。');
      return render();
    }
    if (action === 'end-turn') return endTurn();
  }

  document.addEventListener('click', event => {
    const el = event.target.closest('[data-action]');
    if (!el || !$('#app').contains(el)) return;
    event.preventDefault();
    act(el.dataset.action, el);
  });

  begin('lesson');
})(globalThis);
</script>
</body>
</html>
