<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12211d">
<title>PULSE · 脉冲对决</title>
<style>/* Shared PULSE visual language. Same tokens as the original web client. */
:root {
  --bg: #f5f3ec;
  --paper: #fffcf5;
  --ink: #202934;
  --muted: #788080;
  --line: #dddcd2;
  --accent: #da5c38;
  --mint: #2c7665;
  --gold: #d4a83e;
  --dark: #19222c;
  --radius: 14px;
  font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  color: var(--ink);
  background: var(--bg);
  font-synthesis: none;
}
* { box-sizing: border-box; }
body { margin: 0; min-width: 320px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .42; }
a { color: var(--mint); }
img { max-width: 100%; }
.pulse-top {
  height: 72px;
  padding: 0 max(18px, calc((100vw - 1320px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  border-bottom: 1px solid var(--line);
  background: rgba(245, 243, 236, .97);
}
.pulse-brand {
  display: flex;
  gap: 11px;
  align-items: center;
  color: inherit;
  text-decoration: none;
  background: transparent;
  border: 0;
  padding: 0;
}
.pulse-mark {
  width: 34px;
  height: 34px;
  background: var(--ink);
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: #eae8db;
  font-weight: 800;
}
.pulse-name { font-size: 22px; font-weight: 900; letter-spacing: .07em; line-height: 1; }
.pulse-sub { font-size: 10px; letter-spacing: .16em; margin-top: 4px; color: var(--muted); }
.pulse-nav { display: flex; align-items: center; gap: 22px; }
.pulse-nav a {
  color: #6d7475;
  text-decoration: none;
  font-size: 13px;
  padding: 24px 0;
  border-bottom: 2px solid transparent;
}
.pulse-nav a[aria-current="page"] { color: var(--ink); border-color: var(--accent); font-weight: 700; }
.pulse-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 8px;
  border: 0;
  background: var(--ink);
  color: #fff;
  font-size: 14px;
  font-weight: 650;
  text-decoration: none;
}
.pulse-btn.primary { background: var(--accent); color: #fff; }
.pulse-btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.pulse-btn.light { background: #eeede5; color: var(--ink); border: 1px solid #dbdbd1; }
button:focus-visible, a:focus-visible { outline: 3px solid #eea03d; outline-offset: 3px; }
@media (max-width: 720px) {
  .pulse-top { height: auto; min-height: 64px; padding: 10px 14px; flex-wrap: wrap; }
  .pulse-sub { display: none; }
  .pulse-nav { gap: 14px; width: 100%; }
  .pulse-nav a { padding: 8px 0; }
}

@font-face {
  font-family: "Pulse Numeral";
  src: url("fonts/BarlowCondensed-ExtraBold.woff2") format("woff2");
  font-weight: 800;
  font-style: normal;
  font-display: swap;
}
[hidden] { display: none !important; }
body { background: #05070a; color: #e7f2ea; }
button { border: 0; color: inherit; background: none; font: inherit; }
.table-page { height: 100vh; width: 100vw; background: #05070a; overflow: hidden; }
.arena {
  position: absolute; inset: 0;
  background: #05070a url("scene/pulse-arena-bg-16x9.webp") center / cover no-repeat;
  overflow: hidden;
}
.scene-bg, .traces { display: none; }
.menu-toggle, .log-toggle, .menu-pop button, .scenario-row button {
  min-height: 32px; padding: 4px 10px; border-radius: 8px; font-size: 14px; font-weight: 750;
  color: #f4fff8; background: #10281ce6; border: 1px solid #7dfff0;
}
.menu-toggle, .log-toggle { position: absolute; z-index: 20; top: 12px; }
.menu-toggle { left: 12px; }
.log-toggle { right: 12px; }
.menu-pop, .log-panel {
  position: absolute; z-index: 21; top: 52px; width: min(340px, 88vw);
  padding: 12px; display: grid; gap: 8px;
  background: #0e1714f5; color: #f4fff8; border: 1px solid #8d98a0; border-radius: 12px;
}
.menu-pop { left: 12px; }
.log-panel { right: 12px; max-height: 46vh; overflow: auto; }
.menu-pop .pulse-nav { display: flex; flex-wrap: wrap; gap: 10px; }
.menu-pop .pulse-nav a { color: #d7fff6; }
.scenario-row { display: flex; flex-wrap: wrap; gap: 6px; }
.banner, .turn-banner { position: absolute; left: 50%; z-index: 14; pointer-events: none; }
.banner { top: 56px; transform: translateX(-50%); padding: 6px 10px; background: #3a2a12; color: #ffd89a; border-radius: 8px; }
.turn-banner { display: none !important; }
.opp-dock { position: absolute; z-index: 12; top: 0; left: 50%; width: min(720px, 62vw); height: 86px; transform: translateX(-50%); overflow: visible; pointer-events: none; }
.opp-hand { position: absolute; left: 0; right: 0; top: -34px; height: 112px; display: flex; justify-content: center; align-items: flex-start; }
.back {
  width: 78px; height: 104px; margin: 0 -20px; border-radius: 8px;
  background: url("scene/cardback/pulse-cardback-192x256.webp") center / cover no-repeat;
  transform-origin: center top;
  transform: rotate(calc((var(--i) - (var(--n) - 1) / 2) * -8deg));
  box-shadow: 0 8px 14px #000c;
}
.hand-count {
  position: absolute; top: 50px; left: calc(50% + 168px); right: auto; transform: none;
  padding: 4px 8px; border-radius: 8px;
  background: #10281cf2; color: #f7fffb; font-size: 14px; font-weight: 850;
  border: 1px solid #7dfff0;
}
.compensation {
  position: absolute; z-index: 8; top: 46px; left: 12px; margin: 0; max-width: 240px;
  padding: 4px 8px; border-radius: 8px; background: #10281ce6; color: #fff6d8;
  border: 1px solid #e8a56a; font-size: 13px; font-weight: 800; pointer-events: none;
}
.bays { position: absolute; z-index: 4; left: 10%; top: 25%; width: 7.4%; display: grid; gap: 4px; }
.pile { display: grid; grid-template-columns: 74px 74px; gap: 4px 8px; }
.pile-name { grid-column: 1 / -1; color: #d7fff6; font-size: 14px; font-weight: 850; text-shadow: 0 1px 2px #000; }
.deck-stack, .grave-stack {
  position: relative; width: 100%; aspect-ratio: 3 / 4; display: grid; place-items: center;
  color: #f7fffb; font-size: 18px; font-weight: 900; text-shadow: 0 1px 2px #000;
  background: url("scene/cardback/pulse-cardback-192x256.webp") center / cover no-repeat;
  box-shadow: 4px 3px 0 #0b1612cc, 7px 6px 0 #163028cc;
}
.grave-stack { filter: brightness(.72) saturate(.8); }
.deck-stack span, .grave-stack span { position: absolute; bottom: 8px; font-size: 12px; font-weight: 750; letter-spacing: .04em; }
.silk { color: #d7e2c8; font-size: 12px; font-weight: 700; }
.core-slot { position: absolute; z-index: 4; display: grid; place-items: center; }
.core-slot.foe { top: 78px; left: 50%; width: 132px; height: 122px; transform: translateX(-50%); z-index: 7; }
.core-slot.mine { top: auto; bottom: calc(clamp(180px, 11.5vw, 220px) * 1.26 + 6px); left: 50%; width: 132px; height: 122px; transform: translateX(-50%); z-index: 8; }
.core-wrap { width: 100%; height: 100%; text-align: center; }
.base-btn.core {
  position: relative; width: 100%; height: 78%; padding: 0;
  background: url("scene/ui/core-portrait-frame-a.webp") center / contain no-repeat;
}
.core-slot.mine .base-btn.core { background-image: url("scene/ui/core-portrait-frame-b.webp"); }
.core-portrait {
  position: absolute; z-index: 1; left: 50%; top: 50%; width: 70%; height: 70%; transform: translate(-50%, -54%);
  object-fit: cover; border-radius: 50%; pointer-events: none;
  filter: brightness(1.2) contrast(1.08);
}
.core-name {
  position: absolute; left: 0; right: 0; top: 6%;
  color: #f7fffb; font-size: 12px; font-weight: 850; text-shadow: 0 1px 2px #000;
}
.base-btn .hp {
  position: absolute; left: 50%; bottom: 2%; transform: translateX(-50%); z-index: 2;
  min-width: 42px; padding: 0 8px; border-radius: 999px; background: #120c08ee;
  color: #fff; font-size: clamp(22px, 1.8vw, 36px); font-weight: 900; line-height: 1.2;
  box-shadow: 0 0 0 2px #e8a56a, 0 2px 6px #000;
}
.floater {
  position: absolute; left: 50%; top: 18%; z-index: 3; color: #ff5a3c;
  font-size: 28px; font-weight: 900; text-shadow: 0 2px 0 #000;
  animation: floatup .8s ease forwards; pointer-events: none;
}
.battery {
  position: absolute; display: flex; flex-direction: column; align-items: center; gap: 2px;
  width: max-content; z-index: 8; padding: 0; background: none; border: 0; box-shadow: none;
}
.core-slot.foe .battery { left: calc(100% + 36px); right: auto; top: 50%; transform: translateY(-50%); }
.core-slot.mine .battery { right: calc(100% + 36px); left: auto; top: 50%; transform: translateY(-50%); }
.mana {
  display: flex; gap: 2px; justify-content: center; padding: 5px 8px;
  background: linear-gradient(180deg, #5c656e 0%, #2a3036 42%, #14181c 100%);
  border: 1px solid #c5ced6; border-radius: 999px;
  box-shadow: inset 0 1px 0 #ffffff55, inset 0 -2px 4px #000a, 0 2px 6px #0008;
}
.mana i {
  display: block; width: 30px; height: 30px;
  background: url("scene/ui/lamp-power-off-128.webp") center / contain no-repeat;
}
.mana i.on { background-image: url("scene/ui/lamp-power-on-amber-128.webp"); opacity: 1; filter: drop-shadow(0 0 4px #ffb020); }
.mana i.spent { opacity: .85; filter: saturate(.35) brightness(1.05); }
.mana i.locked { opacity: .55; }
.battery.short { animation: lack .45s ease-in-out 2; }
.supply-read {
  height: 30px; line-height: 30px; font-size: 13px; font-weight: 800; white-space: nowrap;
  color: #f7fffb; text-shadow: 0 1px 2px #000;
}
.supply-read b { font-family: "Pulse Numeral", "Arial Narrow", sans-serif; font-size: 28px; font-weight: 800; letter-spacing: .02em; }
.slots {
  position: absolute; z-index: 3; display: flex; align-items: center; justify-content: safe center;
  gap: 8px; overflow: hidden; padding: 4px 8px;
}
.slots.foe { left: 17%; top: 208px; width: 66%; height: 118px; }
.slots.mine { left: 17%; bottom: calc(clamp(180px, 11.5vw, 220px) * 1.26 + 136px); top: auto; width: 66%; height: 118px; }
.arena.aiming .slots { z-index: 6; overflow: visible; }
.midline {
  position: absolute; z-index: 4; left: 22%; right: 22%; top: 46%; transform: translateY(-50%);
  text-align: center; pointer-events: none;
}
.midline::before {
  content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px;
  background: linear-gradient(90deg, transparent, #39f3d4, #e8a56a, #39f3d4, transparent);
}
.midline h3 { position: relative; display: inline-block; margin: 0; padding: 4px 16px; background: #07110ee8; border: 1px solid #7dfff0; border-radius: 999px; color: #f7fffb; font-size: 20px; }
.formation, .strike { position: relative; margin: 2px 0 0; font-size: 13px; font-weight: 800; color: #d7fff6; text-shadow: 0 1px 2px #04110c; }
.upper-btn { pointer-events: auto; margin-top: 4px; padding: 3px 10px 3px 3px; border-radius: 8px; background: #10281ce6; color: #7dfff0; border: 1px solid #39f3d4; font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
.upper-btn img { width: 28px; height: 36px; object-fit: cover; border-radius: 4px; }
.upper-btn.on { background: #7dfff0; color: #071014; }
#coach { display: none; }
#last-error { position: relative; margin: 2px 0 0; min-height: 16px; font-size: 13px; font-weight: 750; color: #ffb0a4; }
.hand-dock { position: absolute; z-index: 6; left: 8%; right: 8%; bottom: 0; height: calc(clamp(180px, 11.5vw, 220px) * 1.26); pointer-events: none; overflow: hidden; }
.hand-dock .playcard, .hand-dock .hands { pointer-events: auto; }
.hands.fan { height: 100%; display: flex; justify-content: center; align-items: flex-end; overflow: visible; }
.unit-wrap { position: relative; flex: 0 1 132px; width: auto; height: calc(100% - 8px); max-width: 148px; aspect-ratio: 132 / 169; }
.minion, .playcard { position: relative; border: 0; background: transparent; color: #f4f7f8; text-align: center; }
.minion { width: 100%; height: 100%; flex: none; padding: 0; overflow: hidden; }
.act-menu {
  position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); z-index: 12;
  width: max-content; max-width: min(280px, 70vw); display: grid; gap: 6px; padding: 8px;
  background: linear-gradient(180deg, #3a3328 0%, #16130f 100%);
  border: 1px solid #e8c48a; border-radius: 14px;
  box-shadow: 0 12px 24px #000c, inset 0 1px 0 #fff6;
}
.act {
  display: flex; gap: 8px; align-items: center; text-align: left; min-height: 52px; padding: 6px 8px;
  border-radius: 10px; background: #241c14; color: #fff8ee; border: 1px solid #8d6a3a;
}
.act img { width: 28px; height: 28px; object-fit: contain; flex: none; }
.act-copy { display: grid; gap: 2px; }
.act-copy strong { font-size: 15px; font-weight: 900; letter-spacing: .02em; }
.act-copy em { font-style: normal; font-size: 12px; line-height: 1.3; color: #f3e2c4; }
.act-why { color: #ffb089; font-size: 12px; font-weight: 800; }
.act.is-off { filter: grayscale(.4) brightness(.72); }
.hands .playcard:not(.ready) { filter: grayscale(.55) brightness(.7); }
.playcard.coin .art { display: grid; place-items: center; background: radial-gradient(circle, #ffb020 0%, #2a1a08 72%); }
.playcard.coin .coin-lamp { width: 58%; height: auto; }
.cost, .patk, .php, .atk, .hp, .base-btn .hp, .playcard .star {
  font-family: "Pulse Numeral", "Arial Narrow", sans-serif;
  font-weight: 800; color: #fff; -webkit-text-stroke: 1px #102018; paint-order: stroke fill;
  text-shadow: 0 1px 0 #04110c;
}
.playcard {
  width: clamp(180px, 11.5vw, 220px); flex: 0 0 auto; height: calc(clamp(180px, 11.5vw, 220px) * 1.32);
  margin: 0 -36px; padding: 0; overflow: hidden;
  transform-origin: center 150%;
  transform: rotate(calc((var(--i) - (var(--n) - 1) / 2) * 8deg));
}
.minion::before, .playcard::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: url("scene/ui/device-card-frame-c.webp") center / 100% 100% no-repeat;
}
.playcard::before { background-image: url("scene/ui/device-card-frame-b.webp"); }
.minion .portrait, .playcard .art { position: absolute; left: 12%; right: 12%; top: 14%; bottom: 26%; display: block; }
.minion .portrait img, .playcard .art img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
.minion .atk, .minion .hp, .playcard .patk, .playcard .php, .playcard .cost, .playcard .star {
  position: absolute; z-index: 3; width: 18%; aspect-ratio: 1; height: auto; display: grid; place-items: center;
  background-position: center; background-repeat: no-repeat; background-size: contain;
  color: #f7fbff; font-weight: 900; font-size: clamp(13px, 1vw, 18px); text-shadow: 0 1px 1px #000;
}
.minion .atk, .playcard .patk { left: 7%; bottom: 6%; background-image: url("scene/ui/lamp-attack-amber.webp"); color: #2a1a08; }
.minion .hp, .playcard .php { right: 7%; bottom: 6%; background-image: url("scene/ui/lamp-durability-teal.webp"); }
.playcard .cost { left: 7%; top: 6%; background-image: url("scene/ui/lamp-cost-cyan.webp"); }
.playcard .star { right: 7%; top: 6%; width: 16%; background-image: url("scene/ui/lamp-attack-amber.webp"); color: #2a1a08; font-size: 12px; }
.minion .mname, .playcard .cname {
  position: absolute; z-index: 2; left: 16%; right: 16%; bottom: 20%; height: 22px; line-height: 22px;
  font-size: 15px; font-weight: 800; background: #10161ae6; border-radius: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.playcard .detail {
  display: none; position: absolute; left: 14px; right: 14px; top: 62px; z-index: 2;
  padding: 6px; font-size: 14px; line-height: 1.35; color: #f4f7f8; text-align: left;
  background: #07110ee6; border-radius: 8px; max-height: 7em; overflow: hidden;
}
.playcard:hover, .playcard.selected { transform: translateY(-46px) scale(1.12) rotate(0deg); z-index: 7; overflow: visible; }
.playcard:hover .detail, .playcard.selected .detail { display: block; }
.playcard.ready { filter: drop-shadow(0 0 8px #7dfff0); }
.minion.can-attack { box-shadow: 0 0 0 3px #3dff8a, 0 0 16px #3dff8a88; border-radius: 12px; }
.minion.selected { transform: translateY(-10px); }
.minion.hot { filter: drop-shadow(0 0 8px #ff5a3c); }
.minion.guard { filter: drop-shadow(0 0 6px #ffb020); }
.minion.arrive, .link-mark.arrive, .playcard.arrive { animation: flyin .35s ease; }
.minion.lunge { animation: lunge .35s ease; }
.minion.hit, .base-btn.flash { animation: strike .4s ease; }
.link-mark {
  flex: 0 0 52px; width: 52px; height: 96px; align-self: center; position: relative;
  border-radius: 8px; background: #10281ccc; color: #7dfff0; border: 1px dashed #39f3d4;
}
.link-mark .mname { position: absolute; inset: 8px 0 auto; text-align: center; font-weight: 800; }
.link-mark .ribbon { top: auto; bottom: 8px; font-size: 11px; color: #d7fff6; }
.insert {
  flex: 0 0 28px; align-self: center; min-height: 64px; border-radius: 8px;
  color: #071014; background: #7dfff0cc; font-size: 12px; font-weight: 800;
}
.insert.on { outline: 2px solid #fff; }
.ribbon {
  position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1; color: #ffd27a; font-size: 12px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rail.tools { position: absolute; z-index: 6; left: 83.6%; top: 34.8%; width: 7.6%; aspect-ratio: 1; height: auto; display: grid; place-items: center; }
.end-turn {
  width: 100%; height: 100%; display: grid; place-items: center; padding: 0;
  border-radius: 50%; white-space: nowrap; text-align: center;
  background: url("scene/ui/end-turn-button-primary.webp") center / contain no-repeat;
  color: #fff8f2; font-size: clamp(13px, 1vw, 18px); font-weight: 900; line-height: 1.05;
  text-shadow: 0 1px 2px #5a2408;
}
.end-turn.hot { animation: glow 1.25s ease-in-out infinite; }
.end-turn.wait { filter: grayscale(1) brightness(.55); }
.pads { display: none; }
.pads:has(.live) { display: flex; position: absolute; left: 50%; bottom: 108%; transform: translateX(-50%); flex-direction: column; gap: 4px; width: 120px; }
.pad.live { background: #7dfff0; color: #071014; border-color: #7dfff0; font-weight: 800; }
.log { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.45; }
.log .bad { color: #ffb0a4; }
.log-panel h3 { margin: 0; font-size: 16px; }
.dying { pointer-events: none; z-index: 9; animation: shatter .45s ease forwards; }
.builder { max-width: 1100px; margin: 16px auto; padding: 16px; background: var(--paper); color: var(--ink); border-radius: 16px; }
.builder .scenario-row { flex-direction: row; flex-wrap: wrap; }
.top { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--paper); color: var(--ink); }
.pool { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; max-height: 520px; overflow: auto; }
.pool button { text-align: left; padding: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.pool button.picked { outline: 2px solid var(--accent); }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -20%) scale(.94); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -80%); } }
@keyframes flyin { from { opacity: 0; transform: translateY(36px) scale(.8); } to { opacity: 1; transform: none; } }
@keyframes lunge { 0% { transform: translateY(0); } 40% { transform: translateY(-22px) scale(1.05); } 100% { transform: translateY(0); } }
@keyframes strike { 0%, 100% { filter: none; transform: translateX(0); } 35% { filter: brightness(2.4); transform: translateX(-8px); } 70% { transform: translateX(6px); } }
@keyframes shatter { 40% { transform: scale(1.08) rotate(-3deg); filter: brightness(2); } 100% { opacity: 0; transform: scale(.55) translateY(16px); filter: blur(2px); } }
@keyframes glow { 50% { filter: drop-shadow(0 0 12px #ffb020); } }
@keyframes floatup { to { opacity: 0; transform: translate(-50%, -42px); } }
@keyframes lack { 50% { filter: brightness(2.2); } }
@media (max-width: 800px) {
  .arena { background-position: center 42%; }
  .turn-banner { font-size: 28px; padding: 10px 18px; }
  .opp-dock { top: 0; left: 50%; width: 92%; height: 58px; transform: translateX(-50%); }
  .opp-hand { top: -22px; height: 78px; transform: none; }
  .back { width: 48px; height: 64px; margin: 0 -12px; }
  .hand-count { left: calc(50% + 64px); top: 4px; right: auto; font-size: 11px; transform: none; }
  .compensation { top: 42px; left: 8px; right: auto; max-width: 70%; font-size: 11px; }
  .unit-wrap { flex-basis: 96px; max-width: 108px; height: 100%; }
  .minion { width: 100%; height: 100%; }
  .act-menu { max-width: 70vw; }
  .battery { padding: 3px; }
  .mana { width: 92px; flex-wrap: wrap; }

<script>/* pcg.clash.v0 table rules.
 * Bound to prompt commit 5e1caabddd13559ad8d05f1b9ff8b681ec164052.
 * Card numbers come from the playtest JSON. Combat reads kind, cost, attack,
 * durability, guard, bonuses and the closed effect list only.
 * star, family and version are stored when a pack supplies them and are not read here. */
(function (root) {
  'use strict';
  const RULESET = 'pcg.clash.v0';
  const SOURCE_COMMIT = '5e1caabddd13559ad8d05f1b9ff8b681ec164052';
  const IMPLEMENTED_EFFECTS = Object.freeze(['support', 'knob', 'mend', 'damage', 'heal_base', 'supply', 'play_draw', 'play_damage', 'draw_one', 'retrieve_grave', 'arm_aiflow', 'seize']);
  const IMPLEMENTED = new Set(IMPLEMENTED_EFFECTS);

  class ClashError extends Error {
    constructor(message, code = 'rejected') {
      super(message);
      this.name = 'ClashError';
      this.code = code;
    }
  }

  function loadCards(payload) {
    const cards = Object.create(null);
    for (const card of payload.cards) cards[card.template_id] = Object.assign({}, card);
    const token = payload.second_player_token;
    cards[token.template_id] = Object.assign({}, token);
    return cards;
  }

  function starOf(card) {
    if (!card || card.star == null) return null;
    if (card.star === 1 || card.star === 2 || card.star === 3) return card.star;
    return null;
  }

  function familyOf(card) {
    if (!card) return null;
    const value = typeof card.family === 'string' ? card.family : card.growth_family;
    if (typeof value !== 'string') return null;
    const family = value.trim();
    return family ? family : null;
  }

  function validateCard(card) {
    if (card.effect != null && !IMPLEMENTED.has(card.effect)) {
      throw new ClashError('还没有这个效果：' + card.effect, 'unsupported_effect');
    }
    if (card.star != null && starOf(card) == null) {
      throw new ClashError('星级只能是卡数据里的 1、2 或 3', 'bad_star');
    }
    if (Object.prototype.hasOwnProperty.call(card, 'family') && card.family != null && familyOf(card) == null) {
      throw new ClashError('家族必须是卡面上的非空字符串', 'bad_family');
    }
  }

  function loadPack(payload, capabilities) {
    if (!payload || payload.ruleset_id !== RULESET) throw new ClashError('规则集不是 pcg.clash.v0', 'unsupported_effect');
    if (!capabilities || capabilities.ruleset_id !== RULESET || !Array.isArray(capabilities.effects)) {
      throw new ClashError('能力契约不属于这一规则集', 'unsupported_effect');
    }
    for (const effect of capabilities.effects) {
      if (!IMPLEMENTED.has(effect)) throw new ClashError('能力契约里有尚未实现的效果 ' + effect, 'unsupported_effect');
    }
    for (const effect of IMPLEMENTED_EFFECTS) {
      if (!capabilities.effects.includes(effect)) throw new ClashError('能力契约少了已实现的效果 ' + effect, 'unsupported_effect');
    }
    const seen = new Set();
    for (const card of payload.cards) {
      if (seen.has(card.template_id)) throw new ClashError('卡牌编号重复', 'bad_card');
      seen.add(card.template_id);
      validateCard(card);
    }
    validateCard(payload.second_player_token);
    const supportCards = payload.cards.filter(card => card.effect === 'support');
    const support = capabilities.bindings && capabilities.bindings.support;
    if (!support || supportCards.some(card => card.kind !== 'main')) {
      throw new ClashError('支援绑定和卡表不一致', 'binding_mismatch');
    }
    const knobCards = payload.cards.filter(card => card.effect === 'knob');
    const knob = capabilities.bindings.knob;
    if (!knob || knob.temp_attack !== 1 || knobCards.some(card => card.kind !== 'main')) {
      throw new ClashError('旋钮绑定和卡表不一致', 'binding_mismatch');
    }
    const cards = loadCards(payload);
    if (supportCards.length && !cards[support.revive]) throw new ClashError('支援目标不在卡表里', 'binding_mismatch');
    return { cards, rules: rulesFromPayload(payload), tokenId: payload.second_player_token.template_id, capabilities };
  }

  function rulesFromPayload(payload) {
    return {
      baseLife: payload.base_life,
      maxSupply: payload.max_supply,
      handLimit: payload.hand_limit,
      boardLimit: payload.board_limit,
      openingHand: payload.opening_hand.slice()
    };
  }

  function attackOf(cards, unit) {
    const bonus = unit.attachments.reduce((sum, id) => sum + cards[id].attack_bonus, 0);
    return cards[unit.card_id].attack + bonus + unit.temp_attack;
  }

  function hasGuard(cards, unit) {
    if (cards[unit.card_id].guard) return true;
    return unit.attachments.some(id => cards[id].grants_guard);
  }

  function bypassGuard(cards, unit) {
    return unit.attachments.some(id => cards[id].bypass_guard);
  }

  class Game {
    static empty(cards, rules, capabilities) {
      const game = Object.create(Game.prototype);
      game.cards = cards;
      game.rules = rules;
      game.capabilities = capabilities;
      game.bases = [rules.baseLife, rules.baseLife];
      game.max_supply = [0, 0];
      game.supply = [0, 0];
      game.fatigue = [0, 0];
      game.decks = [[], []];
      game.hands = [[], []];
      game.boards = [[], []];
      game.graves = [[], []];
      game.ability_used = [{}, {}];
      game.promoteBan = [[], []];
      game.upper_links = [[], []];
      game.upper_pulsed = [false, false];
      game.aiflow_armed = [false, false];
      game.seat = 0;
      game.turns_started = [1, 0];
      game.phase = 'main';
      game.winner = null;
      game.log = [];
      game._nextId = 1;
      return game;
    }

    constructor(cards, deck0, deck1, rules, tokenId = 'jie_yi_ge_dian', capabilities = null) {
      this.cards = cards;
      this.rules = rules;
      this.capabilities = capabilities;
      this.bases = [rules.baseLife, rules.baseLife];
      this.max_supply = [0, 0];
      this.supply = [0, 0];
      this.fatigue = [0, 0];
      this.decks = [deck0.slice(), deck1.slice()];
      this.hands = [[], []];
      this.boards = [[], []];
      this.graves = [[], []];
      this.ability_used = [{}, {}];
      this.promoteBan = [[], []];
      this.upper_links = [[], []];
      this.upper_pulsed = [false, false];
      this.aiflow_armed = [false, false];
      this.seat = 0;
      this.turns_started = [0, 0];
      this.phase = 'opening';
      this.winner = null;
      this.log = [];
      this._nextId = 1;
      for (let n = 0; n < rules.openingHand[0]; n++) this._openingDraw(0);
      for (let n = 0; n < rules.openingHand[1]; n++) this._openingDraw(1);
      this.hands[1].push(tokenId);
      this.log.push('起手：先手3张，后手4张，后手获得借一格电');
    }

    _openingDraw(seat) {
      if (!this.decks[seat].length) throw new ClashError('起手时牌库不够');
      this.hands[seat].push(this.decks[seat].shift());
    }

    event(text) { this.log.push(text); }

    units(seat) { return this.boards[seat].filter(unit => unit && !unit.link); }

    isChain(cardId) { return !!(this.cards[cardId] && this.cards[cardId].chain_piece); }

    isUpperHost(cardId) { return !!(this.cards[cardId] && this.cards[cardId].upper_host); }

    isEsp32Main(cardId) {
      const card = this.cards[cardId];
      if (!card || card.upper_host || card.kind !== 'main') return false;
      if (card.esp32_main) return true;
      const chips = card['official_' + 'main_chips'] || [];
      const role = card['hardware_' + 'controller'];
      return role === 'independent_host' && chips.join(' ').includes('ESP32');
    }

    formationState(seat) {
      const line = this.boards[seat];
      if (!line.length || line[0].link || this.cards[line[0].card_id].kind !== 'main') {
        return { leader: false, chain_run: 0, percent: 0 };
      }
      let run = 0;
      for (const entry of line.slice(1)) {
        if (entry.link && this.isChain(entry.card_id)) run += 1;
        else break;
      }
      return { leader: true, chain_run: run, percent: 10 + 5 * run };
    }

    strikePreview(seat, attackValue) {
      if (attackValue <= 0) return 0;
      let boosted = attackValue;
      if (this.upper_links[seat].length) boosted += 1;
      if (this.aiflow_armed[seat]) boosted += 2;
      const percent = this.formationState(seat).percent;
      return Math.floor((boosted * (100 + percent) + 99) / 100);
    }

    strikeDamage(seat, attackValue) {
      if (attackValue <= 0) return 0;
      let boosted = attackValue;
      if (this.upper_links[seat].length) boosted += 1;
      if (this.aiflow_armed[seat]) {
        boosted += 2;
        this.aiflow_armed[seat] = false;
      }
      const percent = this.formationState(seat).percent;
      return Math.floor((boosted * (100 + percent) + 99) / 100);
    }

    effectiveMax(seat) {
      const bonus = this.upper_links[seat].length ? 1 : 0;
      return Math.min(10, this.max_supply[seat] + bonus);
    }

    dropUpperLinks(iid) {
      for (const seat of [0, 1]) {
        const kept = this.upper_links[seat].filter(link => link.source !== iid && link.target !== iid);
        if (kept.length !== this.upper_links[seat].length) {
          this.upper_links[seat] = kept;
          if (!kept.length) this.supply[seat] = Math.min(this.supply[seat], this.max_supply[seat]);
        }
      }
    }

    placeLink(seat, cardId, hostIid, index = null) {
      const link = this.makeUnit(seat, cardId, false, 1);
      link.link = true;
      link.host_iid = hostIid;
      if (index == null) this.boards[seat].push(link);
      else this.boards[seat].splice(index, 0, link);
      this.reindex(seat);
      this.event(`链节标记放到座位${seat}位置${link.slot}`);
      return link;
    }

    removeLinks(seat, hostIid) {
      this.boards[seat] = this.boards[seat].filter(unit => !(unit.link && unit.host_iid === hostIid));
      this.reindex(seat);
    }

    seizeUnit(seat, foe) {
      const old = foe.seat;
      const links = this.boards[old].filter(entry => entry.link && entry.host_iid === foe.iid);
      for (const entry of links) this.boards[old].splice(this.boards[old].indexOf(entry), 1);
      this.boards[old].splice(this.boards[old].indexOf(foe), 1);
      this.reindex(old);
      foe.seat = seat;
      foe.sick = true;
      foe.ability_lock = true;
      this.boards[seat].push(foe);
      for (const entry of links) {
        entry.seat = seat;
        this.boards[seat].push(entry);
      }
      this.reindex(seat);
      this.dropUpperLinks(foe.iid);
      this.event(`夺舍，${this.cards[foe.card_id].name}改由座位${seat}控制，排到最右，本回合不能攻击`);
    }

    upperLink(seat, sourceId, targetId) {
      this.requireMain(seat);
      const sourceIid = this.resolveIid(seat, sourceId);
      const targetIid = this.resolveIid(seat, targetId);
      const sourceFound = this.find(sourceIid);
      const targetFound = this.find(targetIid);
      const source = sourceFound[2];
      const target = targetFound[2];
      if (sourceFound[0] !== seat || source.link || !this.isUpperHost(source.card_id)) {
        throw new ClashError('来自上位的爱只能由己方上位机发动', 'bad_target');
      }
      if (source.ability_lock) throw new ClashError('这台单位本回合不能发动技能', 'seized_this_turn');
      if (targetFound[0] !== seat || target.link || !this.isEsp32Main(target.card_id)) {
        throw new ClashError('只能连到己方的 ESP32 主控', 'bad_target');
      }
      if (sourceIid === targetIid) throw new ClashError('不能连自己', 'bad_target');
      if (this.upper_links[seat].some(item => item.source === sourceIid)) {
        throw new ClashError('这台上位机已经连着', 'already_used_ability');
      }
      if (this.upper_links[seat].some(item => item.target === targetIid)) {
        throw new ClashError('这台主控已经连着上位机', 'already_used_ability');
      }
      if (this.supply[seat] < 1) throw new ClashError('供电不足', 'not_enough_supply');
      this.pay(seat, 1);
      const wasEmpty = this.upper_links[seat].length === 0;
      this.upper_links[seat].push({ source: sourceIid, target: targetIid });
      if (wasEmpty && !this.upper_pulsed[seat]) {
        this.supply[seat] = Math.min(10, this.supply[seat] + 1);
        this.upper_pulsed[seat] = true;
      }
      this.supply[seat] = Math.min(this.supply[seat], this.effectiveMax(seat));
      this.event('来自上位的爱接上');
    }

    aliveCount(seat) { return this.units(seat).length; }

    find(iid) {
      for (const seat of [0, 1]) {
        for (let slot = 0; slot < this.boards[seat].length; slot++) {
          const unit = this.boards[seat][slot];
          if (unit && unit.iid === iid) return [seat, slot, unit];
        }
      }
      throw new ClashError('场上没有这张单位');
    }

    requireMain(seat) {
      if (this.winner != null) throw new ClashError('对局已经结束', 'game_over');
      if (this.phase !== 'main' || this.seat !== seat) throw new ClashError('还没轮到这一方的主阶段', 'not_your_turn');
    }

    start_turn() {
      if (this.winner != null) throw new ClashError('对局已经结束', 'game_over');
      if (this.phase !== 'opening' && this.phase !== 'between') {
        throw new ClashError('回合开始只能接在开局或上一回合结束之后', 'bad_phase');
      }
      const seat = this.seat;
      this.phase = 'start';
      this.turns_started[seat] += 1;
      this.ability_used[seat] = {};
      this.promoteBan[seat] = [];
      this.upper_pulsed[seat] = false;
      for (const unit of this.units(seat)) unit.ability_lock = false;
      const firstOpening = seat === 0 && this.turns_started[seat] === 1;
      if (firstOpening) {
        this.event(`座位${seat}回合开始：先手第1回合不抽牌`);
      } else {
        this.event(`座位${seat}回合开始：抽牌`);
        this.draw(seat);
        if (this.winner != null) return;
      }
      for (const unit of this.units(seat)) {
        unit.sick = false;
        unit.attacked = false;
      }
      this.event(`座位${seat}场上原有单位解除新入场限制`);
      this.max_supply[seat] = Math.min(this.rules.maxSupply, this.max_supply[seat] + 1);
      this.supply[seat] = this.effectiveMax(seat);
      this.phase = 'main';
      this.event(`座位${seat}供电上限${this.max_supply[seat]}，当前供电回满`);
    }

    draw(seat) {
      if (this.decks[seat].length) {
        const cardId = this.decks[seat].shift();
        if (this.hands[seat].length >= this.rules.handLimit) {
          this.graves[seat].push(cardId);
          this.event(`座位${seat}手牌已满，${this.cards[cardId].name}展示后进入墓地`);
        } else {
          this.hands[seat].push(cardId);
          this.event(`座位${seat}抽到${this.cards[cardId].name}`);
        }
        return;
      }
      this.fatigue[seat] += 1;
      this.bases[seat] = Math.max(0, this.bases[seat] - this.fatigue[seat]);
      this.event(`座位${seat}疲劳${this.fatigue[seat]}，基地变为${this.bases[seat]}`);
      this.check_bases();
    }

    pay(seat, amount) {
      if (this.supply[seat] < amount) throw new ClashError('供电不足', 'not_enough_supply');
      this.supply[seat] -= amount;
    }

    takeHand(seat, cardId) {
      const index = this.hands[seat].indexOf(cardId);
      if (index < 0) throw new ClashError('手牌里没有这张牌', 'not_in_hand');
      this.hands[seat].splice(index, 1);
    }

    reindex(seat) {
      this.boards[seat].forEach((unit, index) => { unit.slot = index; });
    }

    makeUnit(seat, cardId, sick, durability = null) {
      const unit = {
        iid: `u${this._nextId}`,
        card_id: cardId,
        seat,
        slot: 0,
        durability: durability == null ? this.cards[cardId].durability : durability,
        sick,
        attacked: false,
        temp_attack: 0,
        attachments: [],
        ability_lock: false
      };
      this._nextId += 1;
      return unit;
    }

    insertUnit(seat, cardId, index, sick, durability = null) {
      const row = this.boards[seat];
      if (!Number.isInteger(index) || index < 0 || index > row.length) {
        throw new ClashError('插入位置越界', 'bad_index');
      }
      const unit = this.makeUnit(seat, cardId, sick, durability);
      row.splice(index, 0, unit);
      this.reindex(seat);
      this.event(`座位${seat}${this.cards[cardId].name}进入位置${index}，${sick ? '本回合不能攻击' : '本回合可以攻击'}`);
      return unit;
    }

    resolveIid(seat, ref) {
      if (typeof ref === 'string' && /^u\d+$/.test(ref)) {
        this.find(ref);
        return ref;
      }
      const found = this.units(seat).filter(unit => unit.card_id === ref).map(unit => unit.iid);
      if (found.length !== 1) throw new ClashError('无法唯一确定单位', 'bad_target');
      return found[0];
    }

    play(seat, cardId, target = null, mode = null, index = null) {
      this.requireMain(seat);
      const card = this.cards[cardId];
      if (!card) throw new ClashError('未知卡牌');
      if (!this.hands[seat].includes(cardId)) throw new ClashError('手牌里没有这张牌', 'not_in_hand');
      if (this.supply[seat] < card.cost) throw new ClashError('供电不足', 'not_enough_supply');
      let host = null;
      let at = null;
      if (card.kind === 'main') {
        at = index == null ? this.boards[seat].length : index;
        if (!Number.isInteger(at) || at < 0 || at > this.boards[seat].length) {
          throw new ClashError('插入位置越界', 'bad_index');
        }
        if (card.effect === 'play_damage' && target != null) {
          const found = this.find(this.resolveIid(1 - seat, target));
          if (found[0] === seat) throw new ClashError('入场伤害只能指定敌方单位', 'bad_target');
        }
      } else if (card.kind === 'attachment') {
        if (card.chain_piece && index != null && (!Number.isInteger(index) || index < 0 || index > this.boards[seat].length)) {
          throw new ClashError('插入位置越界', 'bad_index');
        }
        if (target == null) throw new ClashError('配件必须指定己方主控', 'bad_target');
        const found = this.find(this.resolveIid(seat, target));
        if (found[0] !== seat) throw new ClashError('配件只能装在己方主控上', 'bad_target');
        host = found[2];
        if (host.attachments.length >= 1) throw new ClashError('这台主控已经有配件', 'already_has_attachment');
        if (card.grants_guard && hasGuard(this.cards, host)) throw new ClashError('这台主控已经有护卫', 'already_has_guard');
      } else if (card.kind === 'spell') {
        this.prepareSpell(seat, card, target, mode);
      } else {
        throw new ClashError('未知卡种');
      }
      this.pay(seat, card.cost);
      this.takeHand(seat, cardId);
      if (card.kind === 'main') {
        this.insertUnit(seat, cardId, at, !card.rush);
        if (card.effect === 'play_draw') this.draw(seat);
        else if (card.effect === 'play_damage' && target != null) {
          const foe = this.find(this.resolveIid(1 - seat, target))[2];
          const amount = card.effect_amount || card.amount || 1;
          foe.durability = Math.max(0, foe.durability - amount);
          this.event(`入场打击，${this.cards[foe.card_id].name}耐久变为${foe.durability}`);
        }
      } else if (card.kind === 'attachment') {
        host.attachments.push(cardId);
        this.event(`${card.name}装到${this.cards[host.card_id].name}上`);
        if (card.chain_piece) this.placeLink(seat, cardId, host.iid, index);
      } else {
        this.castSpell(seat, card, target, mode);
        this.graves[seat].push(cardId);
        this.event(`${card.name}进入墓地`);
      }
      this.check_deaths();
      this.check_bases();
    }

    prepareSpell(seat, card, target, mode) {
      const effect = card.effect;
      if (effect === 'supply' || effect === 'heal_base' || effect === 'draw_one' || effect === 'retrieve_grave') return;
      if (effect === 'arm_aiflow') {
        if (this.aiflow_armed[seat]) throw new ClashError('说人话还没用掉', 'already_used_ability');
        return;
      }
      if (effect === 'seize') {
        if (target == null || target === 'base') throw new ClashError('夺舍只能指定敌方场上的主控', 'bad_target');
        const foeFound = this.find(this.resolveIid(1 - seat, target));
        const foe = foeFound[2];
        if (foeFound[0] === seat || foe.link || this.cards[foe.card_id].kind !== 'main') {
          throw new ClashError('夺舍只能指定敌方场上的主控', 'bad_target');
        }
        return;
      }
      if (effect === 'damage') {
        if (target == null) throw new ClashError('干扰必须指定敌方单位', 'bad_target');
        const found = this.find(this.resolveIid(1 - seat, target));
        if (found[0] === seat) throw new ClashError('干扰只能指定敌方单位', 'bad_target');
        return;
      }
      if (effect === 'mend') {
        if (target == null) throw new ClashError('补给必须指定己方单位', 'bad_target');
        const found = this.find(this.resolveIid(seat, target));
        if (found[0] !== seat) throw new ClashError('补给只能指定己方单位', 'bad_target');
        if (mode !== 'heal' && mode !== 'temp') throw new ClashError('补给要选择修复或临时强化', 'bad_target');
        return;
      }
      throw new ClashError('未知战术');
    }

    castSpell(seat, card, target, mode) {
      const effect = card.effect;
      if (effect === 'supply') {
        this.supply[seat] += card.amount;
        this.event(`当前供电变为${this.supply[seat]}`);
      } else if (effect === 'heal_base') {
        const before = this.bases[seat];
        this.bases[seat] = Math.min(this.rules.baseLife, this.bases[seat] + card.amount);
        this.event(`座位${seat}基地从${before}变为${this.bases[seat]}`);
      } else if (effect === 'damage') {
        const host = this.find(this.resolveIid(1 - seat, target))[2];
        host.durability = Math.max(0, host.durability - card.amount);
        this.event(`${this.cards[host.card_id].name}耐久变为${host.durability}`);
      } else if (effect === 'mend') {
        const found = this.find(this.resolveIid(seat, target));
        const host = found[2];
        if (found[0] !== seat) throw new ClashError('补给只能指定己方单位', 'bad_target');
        if (mode === 'heal') {
          const cap = this.cards[host.card_id].durability;
          host.durability = Math.min(cap, host.durability + card.amount);
          this.event(`${this.cards[host.card_id].name}耐久变为${host.durability}`);
        } else if (mode === 'temp') {
          host.temp_attack += 1;
          this.event(`${this.cards[host.card_id].name}本回合攻击变为${attackOf(this.cards, host)}`);
        } else {
          throw new ClashError('补给要选择修复或临时强化', 'bad_target');
        }
      } else if (effect === 'draw_one') {
        this.draw(seat);
      } else if (effect === 'retrieve_grave') {
        if (!this.graves[seat].length) this.event('墓地是空的，记一笔没有取回');
        else {
          const recovered = this.graves[seat].pop();
          if (this.hands[seat].length >= this.rules.handLimit) {
            this.graves[seat].push(recovered);
            this.event('手牌已满，记一笔没有取回');
          } else {
            this.hands[seat].push(recovered);
            this.event(`记一笔取回${this.cards[recovered].name}`);
          }
        }
      } else if (effect === 'arm_aiflow') {
        this.aiflow_armed[seat] = true;
        this.event('说人话：本回合下一次打击在百分比之前攻击+2');
      } else if (effect === 'seize') {
        const foe = this.find(this.resolveIid(1 - seat, target))[2];
        this.seizeUnit(seat, foe);
      } else {
        throw new ClashError('未知战术');
      }
    }

    support(seat) {
      this.requireMain(seat);
      const reviveId = this.capabilities.bindings.support.revive;

  }

  function deckOk(deck) {
    return deck.length >= 8 && deck.length <= 12 && new Set(deck).size === deck.length && deck.filter(id => cards[id].kind === 'main').length >= 4;
  }

  function renderBuilder() {
    const seat = ui.builderSeat || 0;
    const deck = ui.decks[seat];
    const filters = [['all', '全部'], ['main', '主控'], ['attachment', '配件'], ['chain', '可升星'], ['baseline', '基线无图'], ['service', '软件服务']];
    const baselineOnly = new Set(content.cards.map(card => card.template_id).filter(id => !roster.cards.some(card => card.template_id === id)));
    const list = Object.keys(cards).filter(id => id !== tokenId).map(id => cards[id]).filter(card => {
      if (ui.poolFilter === 'main') return card.kind === 'main';
      if (ui.poolFilter === 'attachment') return card.kind === 'attachment';
      if (ui.poolFilter === 'chain') return card.growth_kind === 'chain';
      if (ui.poolFilter === 'baseline') return baselineOnly.has(card.template_id);
      if (ui.poolFilter === 'service') return card.record_kind === 'game_service' || card.record_kind === 'design_only_host';
      return true;
    }).sort((a, b) => a.name.localeCompare(b.name, 'zh'));
    $('#app').innerHTML = `<header class="top">
      <div class="brand"><b>PULSE</b><span>扩展组牌</span></div>
      <nav class="pulse-nav" data-shared-entry="clash-home"><a href="../../index.html">大厅</a><a href="../../wiki/index.html">图鉴</a><a href="../index.html">旧版点数</a></nav>
      <button type="button" class="btn" data-action="scenario" data-scenario="lesson">返回教学局</button>
    </header>
    <main class="builder" data-scenario="builder" data-ruleset="${esc(content.ruleset_id)}">
      <p class="balance">96 张硬件图册，加 7 张没有对应图的基线牌，再加没有 SKU、没有图的软件服务和设计牌树莓台。每副 8 到 12 张，至少 4 张主控，同名 1 张。星级只认卡上的 star，不认版本号。数值待试玩。</p>
      <div class="scenario-row">
        <button type="button" data-action="builder-seat" data-seat="0">先手 ${ui.decks[0].length} 张</button>
        <button type="button" data-action="builder-seat" data-seat="1">后手 ${ui.decks[1].length} 张</button>
        <button type="button" data-action="preset" data-preset="first">先手示例：小印链</button>
        <button type="button" data-action="preset" data-preset="second">后手示例：壳与表</button>
        <button type="button" class="primary" data-action="start-free" ${deckOk(ui.decks[0]) && deckOk(ui.decks[1]) ? '' : 'disabled'}>开始扩展对局</button>
      </div>
      <p>${seatName(seat)}牌库：</p>
      <div class="deck-picks" data-deck="${seat}">${deck.map(id => `<span data-card="${esc(id)}">${esc(cards[id].name)}</span>`).join('、') || '还没选'}</div>
      <div class="scenario-row">${filters.map(([id, label]) => `<button type="button" data-action="pool-filter" data-value="${id}">${label}</button>`).join('')}</div>
      <div class="pool">${list.map(card => {
        const star = C.starOf(card);
        const picked = deck.includes(card.template_id);
        const label = card.record_kind === 'game_service' ? '服务' : card.record_kind === 'design_only_host' ? '设计' : kindName(card.kind);
        return `<button type="button" class="${picked ? 'picked' : ''}" data-action="toggle-pool" data-card="${esc(card.template_id)}">${esc(card.name)} · ${card.cost}费 · ${label}${star ? ' · ' + star + '星' : ''}${card.growth_kind === 'chain' ? ' · 可升星' : ''}<br><span class="hint">${esc(card.game_description || card.role_note || '基线牌，没有 96 图')}</span></button>`;
      }).join('')}</div>
    </main>`;
    document.body.dataset.ready = '1';
  }

  function captureGhosts() {
    if (ui.fresh || !game) return [];
    const alive = new Set(game.boards.flat().filter(Boolean).map(unit => unit.iid));
    return [...document.querySelectorAll('.arena .minion[data-iid], .arena .link-mark[data-iid]')].filter(node => !alive.has(node.dataset.iid)).map(node => {
      const rect = node.getBoundingClientRect();
      return { html: node.outerHTML, left: rect.left, top: rect.top, width: rect.width, height: rect.height };
    });
  }

  function mountGhosts(ghosts) {
    const arena = document.querySelector('.arena');
    if (!arena) return;
    ghosts.forEach(ghost => {
      const holder = document.createElement('div');
      holder.innerHTML = ghost.html;
      const card = holder.firstElementChild;
      if (!card) return;
      card.classList.add('dying');
      card.removeAttribute('data-action');
      card.removeAttribute('data-board-seat');
      card.removeAttribute('data-card');
      card.style.position = 'fixed';
      card.style.left = ghost.left + 'px';
      card.style.top = ghost.top + 'px';
      card.style.width = ghost.width + 'px';
      card.style.height = ghost.height + 'px';
      card.style.margin = '0';
      arena.appendChild(card);
      setTimeout(() => card.remove(), 460);
    });
  }

  function render() {
    if (ui.scenario === 'builder') return renderBuilder();
    const ghosts = captureGhosts();
    const over = game.winner == null ? '' : game.winner === 'draw' ? '平局' : `${seatName(game.winner)}获胜`;
    const active = game.seat;
    const other = 1 - active;
    const turnText = over || seatName(active) + '的回合';
    const canEnd = game.winner == null && game.phase === 'main';
    const scenarios = [['lesson', '教学局'], ['support-present', '小印已在场'], ['support-deploy', '先打出小印'], ['support-again', '厚壳再死'], ['promote-stamp', '小印升星'], ['grow', '超过五台'], ['crowd', '两边七台'], ['synergy', '协同与夺舍'], ['builder', '扩展组牌']];
    $('#app').innerHTML = `<div class="table-page">
    <button type="button" class="menu-toggle" data-action="toggle-menu" aria-expanded="${ui.menu ? 'true' : 'false'}">菜单</button>
    <div class="menu-pop"${ui.menu ? '' : ' hidden'}>
      <a class="pulse-brand" data-nav="lobby" href="../../index.html"><span class="pulse-mark">P</span><span class="pulse-name">PULSE</span></a>
      <nav class="pulse-nav" data-shared-entry="clash-home" aria-label="站点入口">
        <a data-nav="lobby" href="../../index.html">大厅</a>
        <a data-nav="clash" href="./index.html" aria-current="page">回合战</a>
        <a data-nav="wiki" href="../../wiki/index.html">图鉴</a>
        <a data-nav="legacy" href="../index.html">旧版点数</a>
      </nav>
      <button type="button" data-action="toggle-reveal" aria-pressed="${ui.reveal}">${ui.reveal ? '遮住对方手牌' : '教学明牌'}</button>
      <button type="button" data-action="restart">重新开局</button>
      <div class="scenario-row">${scenarios.map(([id, label]) => `<button type="button" data-action="scenario" data-scenario="${id}">${label}</button>`).join('')}</div>
    </div>
    ${ui.reveal ? '<div class="banner" id="reveal-banner">教学明牌 · 双方手牌都看得见 · 牌库仍只显示张数</div>' : '<div id="reveal-banner" hidden></div>'}
    <main class="arena table${ui.attacker ? ' aiming' : ''}${canDeploy() ? ' holding' : ''}" data-scene-status="${esc(scenebook.status || 'awaiting_generated_assets')}" data-scenario="${esc(ui.scenario)}" data-ruleset="${esc(content.ruleset_id)}" data-source-commit="${esc(C.SOURCE_COMMIT)}">
      <div class="scene-bg" ${sceneAttr('arena_background')}></div>
      <div class="opp-dock">${handHtml(other, false)}</div>
      ${(game.hands[1] || []).includes(tokenId) ? '<p class="compensation">后手补偿：多 1 张牌 + 借一格电</p>' : ''}
      <aside class="bays">${stack(other)}${stack(active)}</aside>
      <div class="core-slot foe">${core(other)}</div>
      <div class="slots foe">${lane(other)}</div>
      <div class="midline">
        <h3 id="turn-label" data-seat="${game.seat}">${esc(turnText)}</h3>
        <p class="formation" data-formation="${game.formationState(active).percent}">${esc(formationLine(active))}</p>
        ${game.units(active).some(unit => cards[unit.card_id].upper_host && !unit.link) ? `<button type="button" class="upper-btn${ui.linking ? ' on' : ''}" data-action="upper-link"><img src="scene/cards/art-hostlove-432x576.webp" alt="">接通 · 1电</button>` : ''}
        ${strikeHint()}
        <p id="coach">${esc(coach())}</p>
        <p id="last-error" data-code="${esc(ui.error ? ui.error.code : '')}">${ui.error ? esc(ui.error.message) : ''}</p>
      </div>
      <div class="slots mine">${lane(active)}</div>
      <div class="core-slot mine">${core(active)}</div>
      <section class="hand-dock" aria-label="当前手牌">${handHtml(active, true)}</section>
      <aside class="rail tools">
        <button type="button" class="end-turn${canEnd ? ' hot' : ' wait'}" ${sceneAttr('end_turn')} data-action="end-turn">结束回合</button>
        <div class="pads">${actions()}</div>
      </aside>
      <button type="button" class="log-toggle" data-action="toggle-log" aria-expanded="${ui.logOpen ? 'true' : 'false'}">记录</button>
      <aside class="log-panel"${ui.logOpen ? '' : ' hidden'}>
        <h3>对战记录</h3>
        <ol id="action-log" class="log">${ui.log.slice().reverse().map(item => `<li${item.code ? ` class="bad" data-error-code="${esc(item.code)}"` : ''}>${esc(item.text)}</li>`).join('') || '<li>还没有记录</li>'}</ol>
      </aside>
    </main>
    </div>`;
    mountGhosts(ghosts);
    ui.seen = new Set(game.boards.flat().filter(Boolean).map(unit => unit.iid));
    ui.fx = null;
    ui.showBanner = false;
    ui.fresh = false;
    document.body.dataset.ready = '1';
    document.body.dataset.ruleset = content.ruleset_id;
  }

  function play(target, mode, index) {
    const card = selectedCard();
    if (!card) return note(new C.ClashError('请先选择手牌', 'not_in_hand'));
    const seat = game.seat;
    const bases = game.bases.slice();
    try {
      game.play(seat, card.template_id, target == null ? null : target, mode || null, index == null ? null : index);
    } catch (error) {
      return note(error);
    }
    ui.fx = { bases };
    let text = `${seatName(seat)}打出${card.name}，费用 ${card.cost}。`;
    if (card.effect === 'supply') text += `当前供电 ${game.supply[seat]}，上限仍是 ${game.max_supply[seat]}。`;
    push(text);
    clearChoice();
    render();
  }

  function attack(target) {
    if (!ui.attacker) return note(new C.ClashError('请先点一台己方单位', 'bad_target'));
    const attacker = game.find(ui.attacker)[2];
    const attackerId = ui.attacker;
    const bases = game.bases.slice();
    try {
      game.attack(game.seat, ui.attacker, target);
    } catch (error) {
      return note(error);
    }
    ui.fx = { attacker: attackerId, target, bases };
    const name = cards[attacker.card_id].name;
    push(target === 'base' ? `${name}攻击了对方基地。` : `${name}与对方单位同时结算伤害。`);
    clearChoice();
    render();
  }

  function onUnit(el) {
    const iid = el.dataset.iid;
    const seat = Number(el.dataset.seat);
    const unit = game.find(iid)[2];
    if (unit.link) return note(new C.ClashError('链节标记不能被选中', 'bad_target'));
    const card = selectedCard();
    if (ui.linking) {
      if (seat !== game.seat) return note(new C.ClashError('来自上位的爱只能连己方单位', 'bad_target'));
      if (!ui.linkSource) {
        if (!cards[unit.card_id].upper_host) return note(new C.ClashError('来自上位的爱只能由己方上位机发动', 'bad_target'));
        ui.linkSource = iid;
        ui.error = null;
        return render();
      }
      try { game.upperLink(game.seat, ui.linkSource, iid); }
      catch (error) { return note(error); }
      push(`来自上位的爱接上。当前供电 ${game.supply[game.seat]}，有效上限 ${game.effectiveMax(game.seat)}。`);
      clearChoice();
      return render();
    }
    if (ui.knob) {
      try { game.knob(game.seat, pack.capabilities.bindings.knob.source, iid); }
      catch (error) { return note(error); }
      push(`旋钮台强化了${cards[game.find(iid)[2].card_id].name}，本回合攻击 +1。`);
      clearChoice();
      return render();
    }
    if (card && card.effect === 'seize') {
      if (seat === game.seat) return note(new C.ClashError('夺舍只能指定敌方场上的主控', 'bad_target'));
      return play(iid);
    }
    if (card && card.kind === 'attachment') {
      if (seat !== game.seat) return note(new C.ClashError('配件只能装在己方主控上', 'bad_target'));
      return play(iid, null, card.chain_piece ? ui.chainIndex : null);
    }
    if (card && card.effect === 'play_damage') {
      if (seat === game.seat) return note(new C.ClashError('入场伤害只能指定敌方单位', 'bad_target'));
      return play(iid);
    }
    if (card && card.effect === 'damage') return play(iid);
    if (card && card.effect === 'mend') {
      ui.target = iid;
      ui.error = null;
      return render();
    }
    if (seat === game.seat) {
      ui.attacker = iid;
      ui.handIndex = null;
      ui.error = null;
      return render();
    }
    if (ui.attacker) return attack(iid);
    note(new C.ClashError('这台不是你的单位', 'bad_target'));
  }

  function endTurn() {
    const next = 1 - game.seat;
    const deckBefore = game.decks[next].length;
    const handBefore = game.hands[next].length;
    const graveBefore = game.graves[next].length;
    const fatigueBefore = game.fatigue[next];
    const actor = seatName(game.seat);
    try {
      C.finishTurn(game);
    } catch (error) {
      return note(error);
    }
    clearChoice();
    let text = `${actor}结束回合，临时攻击和供电清零。立刻轮到${seatName(game.seat)}。`;
    if (deckBefore === 0 && game.fatigue[next] !== fatigueBefore) {
      text += game.winner != null
        ? ` ${seatName(next)}疲劳后基地倒下，供电上限没有增加。终局锁定。`
        : ` ${seatName(next)}疲劳 ${game.fatigue[next]}，基地 ${game.bases[next]}，然后供电回满。`;
    } else if (deckBefore > 0 && game.hands[next].length === handBefore && game.graves[next].length > graveBefore) {
      text += ` 手牌已满，${cards[game.graves[next].at(-1)].name}亮出后进入墓地。`;
    } else if (deckBefore > 0 && game.hands[next].length > handBefore) {
      text += ui.reveal ? ` 教学明牌：抽到${cards[game.hands[next].at(-1)].name}。` : ' 抽了 1 张牌。';
    } else if (game.seat === 0 && game.turns_started[0] === 1) {
      text += ' 先手第 1 回合不抽牌。';
    }
    push(text);
    ui.showBanner = true;
    render();
  }

  function act(action, el, event) {
    if (el && el.dataset && el.dataset.block) {
      const why = el.querySelector('.act-why');
      return note(new C.ClashError(why ? why.textContent : '现在不能这么做', el.dataset.block));
    }
    if (action === 'toggle-menu') { ui.menu = !ui.menu; return render(); }
    if (action === 'toggle-log') { ui.logOpen = !ui.logOpen; return render(); }
    if (action === 'toggle-reveal') { ui.reveal = !ui.reveal; return render(); }
    if (action === 'toggle-catalog') { ui.catalog = !ui.catalog; return render(); }
    if (action === 'restart' || action === 'scenario') return begin(action === 'restart' ? ui.scenario : el.dataset.scenario);
    if (action === 'select-hand') {
      const index = Number(el.dataset.handIndex);
      if (event.detail >= 2) return deployFromHand(index);
      ui.handIndex = index;
      ui.attacker = null;
      ui.target = null;
      ui.knob = false;
      ui.linking = false;
      ui.linkSource = null;
      ui.chainIndex = null;
      ui.aiming = wantsTarget(cards[el.dataset.card]);
      ui.error = null;
      return paintSelection();
    }
    if (action === 'select-unit') return onUnit(el);
    if (action === 'play') return play(null);
    if (action === 'insert') {
      const held = selectedCard();
      if (held && held.chain_piece) {
        ui.chainIndex = Number(el.dataset.index);
        ui.error = null;
        return render();
      }
      return play(null, null, Number(el.dataset.index));
    }
    if (action === 'upper-link') {
      ui.linking = !ui.linking;
      ui.linkSource = null;
      ui.handIndex = null;
      ui.attacker = null;
      ui.knob = false;
      ui.error = null;
      return render();
    }
    if (action === 'mend-heal') return play(ui.target, 'heal');
    if (action === 'mend-temp') return play(ui.target, 'temp');
    if (action === 'attack-base') return attack('base');
    if (action === 'hit-base') {
      if (Number(el.dataset.seat) !== game.seat && ui.attacker) return attack('base');
      return;
    }
    if (action === 'support') {
      try { game.support(game.seat); }
      catch (error) { return note(error); }
      push('小印支援：厚壳插到最左，原来的单位右移。厚壳满耐久、有护卫，本回合不能攻击。小印留在场上。');
      clearChoice();
      return render();
    }
    if (action === 'arm-knob') {
      ui.knob = true;
      ui.handIndex = null;
      ui.attacker = null;
      ui.error = null;
      return render();
    }
    if (action === 'promote') {
      const currentId = el.dataset.current;
      const current = cards[currentId];
      const next = cards[current.next_template_id];
      const cost = Math.max(1, next.cost - current.cost);
      try { game.promote(game.seat, currentId); }
      catch (error) { return note(error); }
      push(`${current.name}升成${next.name}，花了 ${cost} 电。新牌在原处，满耐久，本回合不能攻击，旧配件不留下。`);
      clearChoice();
      return render();
    }
    if (action === 'builder-seat') { ui.builderSeat = Number(el.dataset.seat); return render(); }
    if (action === 'pool-filter') { ui.poolFilter = el.dataset.value; return render(); }
    if (action === 'preset') {
      ui.decks[ui.builderSeat] = (el.dataset.preset === 'second' ? presetSecond : presetFirst).slice();
      return render();
    }
    if (action === 'toggle-pool') {
      const id = el.dataset.card;
      const deck = ui.decks[ui.builderSeat];
      const index = deck.indexOf(id);
      if (index >= 0) deck.splice(index, 1);
      else if (deck.length >= 12) return note(new C.ClashError('一副最多 12 张', 'bad_card'));
      else deck.push(id);
      ui.error = null;
      return render();
    }
    if (action === 'start-free') {
      if (!deckOk(ui.decks[0]) || !deckOk(ui.decks[1])) return note(new C.ClashError('两副都要 8 到 12 张，且至少 4 张主控', 'bad_card'));
      const decks = ui.decks.map(deck => deck.slice());
      ui = blankUi('free');
      game = new C.Game(cards, decks[0], decks[1], rules, tokenId, pack.capabilities);
      game.start_turn();
      push('扩展对局开始。牌序按组牌时的点选顺序，不洗牌。');
      return render();
    }
    if (action === 'end-turn') return endTurn();
  }

  document.addEventListener('click', event => {
    const el = event.target.closest('[data-action]');
    if (!el || !$('#app').contains(el)) return;
    event.preventDefault();
    act(el.dataset.action, el, event);
  });
  document.addEventListener('dblclick', event => {
    const el = event.target.closest('[data-action="select-hand"]');
    if (!el || !$('#app').contains(el)) return;
    event.preventDefault();
    deployFromHand(Number(el.dataset.handIndex));
  });

  begin('lesson');
})(globalThis);
</script>
</body>
</html>
